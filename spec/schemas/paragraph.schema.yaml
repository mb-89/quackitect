# What a paragraph may hold, and nothing else. A door refuses what stands
# outside these sets, so this file is a whitelist and names no bad word.
#
# The projection writes it into spec/config/styles/VoiceParagraph, one rule per
# layer, and into VoiceJudged for the layers a model holds. A person edits this
# file, and the write door refuses a hand edit to a target.
# [[spec/funnel/a-paragraph-has-a-schema]]
#
# A register overrides a value for the paths it names, and keeps every value it
# leaves out. `exceptions` under a layer is the list the retro grows: one entry,
# one reason. A count guards it, so a rule refusing one phrase past `misreads`
# times in a session writes a warn row naming itself.

kind: paragraph
misreads: 3

layers:
  characters:
    admits: letters, digits, space, and the punctuation below
    punctuation: [full stop, comma, question mark, exclamation mark, colon, parentheses, apostrophe, quotation mark, hyphen]
    exceptions:
      - word: TL;DR
        reason: a name the answer register uses, and the semicolon belongs to it

  markup:
    admits:
      - a code span
      - a link, [[wiki]] or [text](target)
      - a fence
      - a table
      - a list item, ordered or not
      - a heading
      - a strong lead on a bullet
    heading:
      words: 5
      oneTitle: true
    strongLead:
      words: 4
    exceptions: []

  shape:
    sentencesPerParagraph: 6
    paragraphsPerRun: 3
    listWhen: three or more parallel things stand in one sentence
    exceptions: []

  sentence:
    words:
      min: 2
      max: 25
      listItem: 20
    opensWith: [a capital, a digit, a code span, a quote]
    closesWith: [".", "?", "!"]
    codeSpans: 4
    exceptions: []

  grammar:
    finiteVerbs: 1
    tenses: [simple present, simple past, simple future, imperative, infinitive]
    auxiliaryChains: refused
    modals: [can, must, will]
    contractions: refused
    latinShortForms: refused
    exceptions:
      - word: bound
        reason: a status here, and the tagger reads a past tense
      - word: complicated
        reason: an adjective here
      - word: held
        reason: a status here
      - word: numbered
        reason: an adjective here
      - word: refused
        reason: an adjective here
      - word: settled
        reason: an adjective here
      - word: switched
        reason: an adjective here
      - word: approved
        reason: an adjective here, on a word list
    presentOnItsFace: a form that is its own lemma, or its -s or -ing form, stands, and the tense reader vetoes the tagger

  vocabulary:
    core: spec/vocabulary/core.yml
    terms: spec/vocabulary/terms.yml
    swaps: spec/vocabulary/swaps.yml
    stems: a plural, a past form and an -ing form of a listed word stand
    outside:
      - a code span
      - a link
      - a path
      - a word opening with a capital past the first word
    growth:
      who: a person, or a session together with the note that defines the word
      entry: word and defines, a link to the note that defines it
      review: the retro reads the terms added since, keeps each, or moves it to the swaps with the word to write
      swap: a swap wins over every list, so a swapped word meets a refusal until the writer takes the word it names
    exceptions:
      - word: TL;DR
        reason: a name the answer register uses, and its tail reads as a word
      - word: isnt
        reason: the voice rule against the negative writes it, and the apostrophe belongs to a contraction

  # The judge holds this layer, one question per rule. The projection writes
  # each entry into spec/config/styles/VoiceJudged. `span` says what one
  # question reads, `reads` says which paths cost a call, and `ignores` says
  # which paths cost none.
  meaning:
    judged:
      # A guidance note stands for as long as the tree does, and a reader opens
      # it to learn what to do. A handover, a rationale and a design doc each
      # carry something else, so this question names the folder it reads. A
      # runtime older than `reads` falls back to `ignores`, so both stand.
      - id: Actionable
        asks: Does this text tell the reader something they can act on, or does it explain where something came from, what once happened, or how many of something there were?
        message: Write what the reader does next. Put the background in spec/rationales.
        link: spec/guidance/guidance.md
        labels: [actionable, background]
        refuses: background
        span: paragraph
        reads: [spec/guidance/*.md]
        ignores: [spec/rationales/*.md, spec/design_output/*.md, spec/funnel/*.md, .se/*.md]

      # A name passes every pattern, because it is an ordinary word of ordinary
      # length carrying no separator. The tracked notes alone, because a raw
      # note under .se reaches git never.
      - id: Role
        asks: Does this text name a role somebody holds, such as the owner, the agent, the reader, the reviewer or the maintainer, or does it name one particular person, through a name, a handle or an address?
        message: Name the role, and leave the person out. This tree holds the owner, the agent, the reader, the reviewer and the maintainer.
        link: spec/guidance/voice.md
        labels: [role, person]
        refuses: person
        span: paragraph
        reads: ["*.md", spec/**/*.md]
        ignores: [.se/*.md]

      # A chapter carries one outcome, and an answer with no heading is one
      # chapter. So this question reads a chapter and asks where the outcome
      # stands inside it. A chapter opens on its own heading, so the question
      # reads the block under that heading and leaves the heading out.
      - id: BottomLineFirst
        asks: Ignore a heading line. Where does this text state its main point? first means in its first block, late means only after other detail near the end, and even means every block carries equal weight.
        message: Put the bottom line first, and the detail under it.
        link: spec/guidance/voice.md
        labels: [first, late, even]
        refuses: late
        span: chapter
        reads: ["*.md", spec/**/*.md]
        ignores: [.se/*.md]

      # Voice rule 3 wants a list, a table or a diagram before prose. The list
      # costs no call and stands in Vale, so the judge holds the other two.
      - id: ShapeFits
        asks: Do these sentences give the same fields for different things, or say what reaches what and what happens after what, or neither?
        message: Reach for a table or a diagram first, and write prose where neither fits.
        link: spec/guidance/voice.md
        labels: [prose, table, diagram]
        refuses: [table, diagram]
        span: paragraph
        reads: ["*.md", spec/**/*.md]
        ignores: [.se/*.md]

registers:
  prose:
    paths: ["*.md", "*.markdown", "*.txt", "a comment in code"]

  answer:
    paths: ["*answer.md"]
    shape:
      sentencesPerParagraph: 3
      paragraphsPerRun: 2
    opens:
      - block: questions
        when: the prompt carries a sentence closing on `?`
        shape: a table headed `question` and `answer`, one row per question
      - block: tldr
        when: always
        shape: a list, one sentence per item, one bottom line each, before any heading
    then: the detail, under headings

  requirement:
    paths: ["spec/requirements/*.md"]
    grammar:
      modals: [can, must, will, shall, should]
      meaning: shall binds and should advises, as RFC 2119 gives them
