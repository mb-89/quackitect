# What a paragraph may hold, and nothing else. A door refuses what stands
# outside these sets, so this file is a whitelist and names no bad word.
#
# The projection writes it into spec/config/styles/VoiceParagraph, one rule per
# layer. A person edits this file, and the write door refuses a hand edit to a
# target.
# [[spec/design_output/projection#the-second-target]]
#
# A register overrides a value for the paths it names, and keeps every value it
# leaves out. `exceptions` under a layer is the list the retro grows: one entry,
# one reason. A count guards it, so a rule refusing one phrase past `misreads`
# times in a session writes a warn row naming itself.

kind: paragraph
misreads: 3

# The side a rule's break stands on, keyed by the rule file the projection
# writes. A rule this map leaves out reads error, so the write door refuses its
# break and the push door names it nowhere. A rule reading warning lets the
# write land, and the lint over the files a push carries names it.
#
# A rule of form reads warning: a cap on a sentence, a list item or a paragraph,
# a tense, a register, a mark on the page. Those stand in the Problems panel
# until the push clears them, and the meaning stands. A rule of substance reads error: a word outside the
# core, and the answer register, because no hand mends an answer after it lands.
# [[spec/rationales/voice#11-form-and-substance]]
rules:
  RestatedTable: warning
  Sentence: warning
  ListItem: warning
  Paragraph: warning
  Markup: warning
  Characters: warning
  CodeSpans: warning
  Shape: warning
  PastTense: warning
  Auxiliary: warning
  Progressive: warning
  Modal: warning
  Hedge: warning
  Contraction: warning
  Latin: warning
  EtCetera: warning

# The frontmatter answers to its own schema, so these rules leave it alone. A
# key below names a field a person writes prose into, and the rules read the
# value of that field alone. Every other field is the engine's or the shape's,
# and a rule over prose says nothing true about it.
#
# A key here holds one scalar of prose. The rules read a raw line, so a field
# holding a sequence carries its own brackets and quotes into the reading, and
# `scope` stands out for that reason.
# [[spec/tickets/voice-rules-skip-the-record]]
frontmatter:
  prose: [does, says, checklist, comment, help, ask]

layers:
  characters:
    admits: letters, digits, space, and the punctuation below
    punctuation: [full stop, comma, question mark, exclamation mark, colon, parentheses, apostrophe, quotation mark, hyphen]
    exceptions:
      - word: TL;DR
        reason: a name the answer register uses, and the semicolon belongs to it

  markup:
    admits:
      - a code span
      - a link, [[<wiki>]] or [text](target)
      - a fence
      - a table
      - a list item, ordered or not
      - a heading
      - a strong lead on a bullet
    heading:
      words: 5
      oneTitle: true
    strongLead:
      words: 4
    exceptions: []

  shape:
    sentencesPerParagraph: 6
    paragraphsPerRun: 3
    listWhen: three or more parallel things stand in one sentence
    exceptions: []

  # A paragraph beside a table says what the table leaves unsaid, so a run of
  # words standing in both reads as one fact in two places.
  # [[spec/design_output/lsp#a-second-copy-draws]]
  restated:
    table: 6

  sentence:
    words:
      min: 2
      max: 25
      listItem: 20
    opensWith: [a capital, a digit, a code span, a quote]
    closesWith: [".", "?", "!"]
    codeSpans: 4
    exceptions: []

  grammar:
    finiteVerbs: 1
    tenses: [simple present, simple past, simple future, imperative, infinitive]
    auxiliaryChains: refused
    modals: [can, must, will]
    hedges:
      - just
      - very
      - really
      - actually
      - basically
      - simply
      - quite
      - rather
      - fairly
      - somewhat
      - perhaps
      - maybe
      - probably
      - seems
      - seem
      - essentially
      - clearly
      - obviously
      - certainly
      - arguably
      - importantly
      - of course
      - in order to
      - it is worth
    contractions: refused
    latinShortForms: refused
    exceptions:
      - word: bound
        reason: a status here, and the tagger reads a past tense
      - word: complicated
        reason: an adjective here
      - word: held
        reason: a status here
      - word: numbered
        reason: an adjective here
      - word: refused
        reason: an adjective here
      - word: settled
        reason: an adjective here
      - word: switched
        reason: an adjective here
      - word: approved
        reason: an adjective here, on a word list
      - word: missing
        reason: an adjective here, and the progressive rule reads it after is
      - word: standing
        reason: a gerund here, and the progressive rule reads it after is
    presentOnItsFace: a form that is its own lemma, or its -s or -ing form, stands, and the tense reader vetoes the tagger

  vocabulary:
    core: spec/vocabulary/core.yml
    terms: spec/vocabulary/terms.yml
    swaps: spec/vocabulary/swaps.yml
    endings: spec/config/stems.yaml
    stems: a plural, a past form and an -ing form of a listed word stand, and so does a prefix, as the table of endings names
    outside:
      - a code span
      - a link
      - a path
      - a word opening with a capital past the first word
    growth:
      who: a person, or a session that needs the word
      entry: word and means, one line in core words and other terms, and source where it cites an address outside the tree
      review: the retro reads the terms added since, keeps each, or moves it to the swaps with the word to write
      swap: a swap wins over every list, so a swapped word meets a refusal until the writer takes the word it names
    exceptions:
      - word: TL;DR
        reason: a name the answer register uses, and its tail reads as a word
      - word: isnt
        reason: the voice rule against the negative writes it, and the apostrophe belongs to a contraction

registers:
  prose:
    paths: ["*.md", "*.markdown", "*.txt", "a comment in code"]

  answer:
    paths: ["*answer.md"]
    shape:
      sentencesPerParagraph: 3
      paragraphsPerRun: 2
    opens:
      - block: questions
        when: the prompt carries a sentence closing on `?`
        shape: a table headed `question` and `answer`, one row per question
      - block: tldr
        when: always
        shape: a list, one sentence per item, one bottom line each, before any heading
    then: the detail, under headings

  requirement:
    paths: ["spec/design_input/*.md"]
    grammar:
      modals: [can, must, will, shall, should]
      meaning: shall binds and should advises, as RFC 2119 gives them
