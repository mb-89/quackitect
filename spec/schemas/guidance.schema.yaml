# A guidance note carries the rules for one audience, and nothing else. The
# argument for a starred rule stands in the rationale this note links.
#
# Two chapters stand here, because spec/guidance/guidance.md says a note holds
# `Actionables`, an `Examples` table under them, and links its rationale. A
# Motivation chapter would carry the argument a second time, and the rationale
# is where it belongs. An example gives a model the shape a rule names: what
# to do and what not to do. The rows go to the rules the tree sees fail, so a
# rule takes several, one or none.
#
# A rule ending in the answer marker describes an answer, which evidence carries
# nowhere, so the judge of spec/design_output/pull.md reads it over none. Every
# reader strips both marks.
#
# The frontmatter half is JSON Schema 2020-12, https://json-schema.org/draft/2020-12.
# The body half is this project's own, borrowed from https://document-schema.org.
# A value written [[<name>]] is a link, and the name inside is the value.
#
# A bound a rule already holds stays with that rule. The sentence layer of
# spec/schemas/paragraph.schema.yaml bounds every sentence here, so this file
# names no word count.

kind: guidance

governs:
  - spec/guidance/**

frontmatter:
  type: object
  additionalProperties: false
  required:
    - kind
    - scope
  properties:
    kind:
      const: guidance
      x-link: true
      description: the schema this note is minted from

    scope:
      type: array
      description: who this note binds, one entry per audience

    rationale:
      x-link: true
      description: the note arguing for the starred rules, one link

    env:
      type: array
      description: the variables saying a session is in scope, where that scope is a machine

    style:
      type: boolean
      description: true puts this note into the output style, which the client sends with every request

body:
  headingLevel: 1
  order: strict
  extraSections: false

  sections:
    - header: Actionables
      required: true
      list: true
      ordered: true
      detailMarker: "*"
      answerMarker: "^"
      tense: present
      maxItems: 15
      description: one rule per item, in the active voice, as an instruction

    - header: Examples
      required: false
      position: last
      table:
        heads: [the rule, do, do not]
        namesOf: Actionables
      description: rows for the rules the tree sees fail, each naming its rule by number, with what to do and what not to do
