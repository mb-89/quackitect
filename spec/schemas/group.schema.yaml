# A group is the unit a box works and the unit that lands. It is a branch named
# `work/<group>` and a note of this kind, and the branch is the claim on it.
#
# The note carries a route of its own, which the pull hands out around the
# group's tickets. Its `tickets` step belongs to no hand, and it ends when no
# ticket in the group stands at a step an agent may take.
#
# The route reads from `ticket.schema.yaml`, which is its one home.
#
# The frontmatter half is JSON Schema 2020-12, https://json-schema.org/draft/2020-12.
# The body half is this project's own, borrowed from https://document-schema.org.
# [[spec/design_input/the-agent-pulls-tickets]]

kind: group

governs:
  - spec/groups/**

frontmatter:
  type: object
  additionalProperties: false
  required:
    - kind
    - state
    - urgency
    - steps
  properties:
    kind:
      const: group
      x-link: true
      description: the schema this note is minted from

    state:
      enum: [todo, held, done]
      description: whether a box holds this group, and the push arbitrates two boxes

    urgency:
      enum: [now, soon, whenever]
      description: which group a box takes first

    step:
      type: string
      x-names: steps
      x-leaf: true
      description: the leaf of the route this group stands on, as a path

    steps:
      $ref: "ticket#/frontmatter/properties/steps"
      description: the route the pull hands out around this group's tickets
      default:
        - name: tickets
          by: tickets

    process:
      x-link: true
      description: the route the mint copies from, as a link to a process

    process_hash:
      type: string
      description: the hash of the process file the route is copied from

    record:
      type: array
      description: the engine's entry per leaf handed back, and no hand writes it

body:
  headingLevel: 1
  order: strict
  extraSections: false
  tense: present

  sections:
    - header: Ask
      required: true
      description: what these tickets add up to, for the hand that takes them

    - x-one-per: steps
