# What one session hands the next on one box, at `.se/HANDOVER.md`.
#
# A handover reaches one reader once, and level zero deletes the copy it reads.
# So it carries a message, and the rules that hold documentation stand off it.
#
# A typo in `status` goes quiet. The enum below refuses it instead.
#
# The frontmatter half is JSON Schema 2020-12, https://json-schema.org/draft/2020-12.
# The body half is this project's own, borrowed from https://document-schema.org.

kind: handover

governs:
  - .se/HANDOVER.md

frontmatter:
  type: object
  additionalProperties: false
  required:
    - kind
    - status
  properties:
    kind:
      const: handover
      x-link: true
      description: the schema this note is minted from

    status:
      enum: [todo, held, done]
      description: where the session leaves the work it hands on

    urgent:
      type: boolean
      description: whether a session takes this branch first

    depends_on:
      type: [array, string]
      description: the branches this one waits for, a list or one line of names

body:
  headingLevel: 1
  order: free
  extraSections: true
  tense: present

  sections:
    - header: Where it stands
      required: true
      description: the commit, the gate, and what the last session finished

    - header: What waits
      required: true
      description: what the next reader does, one row per thing

    - header: The owner's words
      required: true
      description: the owner's words as said, one quote a line, each with its session and transcript line

# A chapter between the two carries its own name.
