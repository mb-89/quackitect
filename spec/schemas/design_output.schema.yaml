# What a piece of this tree does, and why it takes the shape it takes.
#
# A trace points up the chain and stands in one place. A design output refines
# design inputs, and a section of code implements a design output. So this note
# names the inputs above it, and the code below names this note.
#
# The body runs free. Twelve notes share no chapter, because each follows the
# thing it holds.
#
# The frontmatter half is JSON Schema 2020-12, https://json-schema.org/draft/2020-12.
# The body half is this project's own, borrowed from https://document-schema.org.

kind: design_output

governs:
  - spec/design_output/**

frontmatter:
  type: object
  additionalProperties: false
  required:
    - kind
  properties:
    kind:
      const: design_output
      x-link: true
      description: the schema this note is minted from

    refines:
      type: array
      x-link: true
      description: the design inputs this note refines, one link per entry

body:
  headingLevel: 1
  order: free
  extraSections: true
  tense: present

  sections:
    - header: Scope
      required: true
      description: what this note covers, said before any mechanism reaches the reader

# Every chapter after Scope carries its own name, because each follows the thing
# it holds. A comment in the code points at one of those names.
