# A process is a route the mint copies onto a ticket. It is a bare YAML file
# under `spec/processes/`, holding a `steps` list and nothing more, so a reader
# meets the route and no frontmatter around it.
#
# This schema names no `body`, so it governs a file rather than a note. The
# checker weighs the whole file as one map, `schemasIn` leaves it out, and `mint`
# offers the note kinds alone.
#
# The route reads from `ticket.schema.yaml`, which is its one home. So a fix to
# the route's fields reaches a process file and a ticket together.
#
# The rules are JSON Schema 2020-12, https://json-schema.org/draft/2020-12.
# [[spec/design_input/the-agent-pulls-tickets]]

kind: process

governs:
  - spec/processes/*.yaml

data:
  type: object
  additionalProperties: false
  required:
    - steps
  properties:
    steps:
      $ref: "ticket#/frontmatter/properties/steps"
      description: the route, as a tree of steps in the order a hand meets them
