# The argument for what another note instructs. Every other kind says what to
# do, and this one says why, what it gives up, and what would make it wrong.
#
# A rationale stands behind anything, so `explains` stays optional. It is the
# one trace this file keeps, because the linter resolves it already: where the
# note it names marks its items, a chapter here carries each mark.
#
# The frontmatter half is JSON Schema 2020-12, https://json-schema.org/draft/2020-12.
# The body half is this project's own, borrowed from https://document-schema.org.

kind: rationale

governs:
  - spec/rationales/**

frontmatter:
  type: object
  additionalProperties: false
  required:
    - kind
  properties:
    kind:
      const: rationale
      x-link: true
      description: the schema this note is minted from

    explains:
      x-link: true
      description: the note these chapters argue for, where that note marks its items

    supersedes:
      x-link: true
      description: the rationale this replaces, where a decision comes round again

body:
  headingLevel: 1
  order: strict
  extraSections: false

  sections:
    - header: Why
      required: true
      tense: past
      description: the argument, and what it measures

      subsections:
        headingLevel: 2
        numbered: true
        order: strict
        matches: explains
        description: one chapter per marked item, titled with that item's number
