# The argument for what another note instructs. Every other kind says what to
# do, and this one says why, what it gives up, and what would make it wrong.
#
# A rationale stands behind anything, so both entries below turn on one fact:
# whether the note it argues for marks its items.
#
#   the note marks items  ->  explains names it, and a chapter carries each mark
#   the note marks none   ->  explains stands empty, and the chapters run free
#
# The frontmatter half is JSON Schema 2020-12, https://json-schema.org/draft/2020-12.
# The body half is this project's own, borrowed from https://document-schema.org.

kind: rationale

frontmatter:
  type: object
  additionalProperties: false
  required:
    - kind
  properties:
    kind:
      const: rationale
      x-link: true
      description: which schema reads this note

    explains:
      x-link: true
      description: the note these chapters argue for, where that note marks its items

    supersedes:
      x-link: true
      description: the rationale this replaces, where a decision comes round again

body:
  headingLevel: 1
  order: strict
  extraSections: false

  sections:
    - header: Why
      required: true
      tense: past
      description: the argument, and what it measures

      subsections:
        headingLevel: 2
        numbered: true
        order: strict
        matches: explains
        description: one chapter per marked item, titled with that item's number
