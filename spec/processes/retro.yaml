# The tree's retro.
# [[spec/design_input/the-agent-pulls-tickets#the-retro]]
for: a window of the record, and the changes to the machinery it earns
ask:
  - name: why
    form: text
    says: what calls for it, as notes standing open, an iteration ending, or the owner asking
steps:
  - name: collect
    does: moves everything the private folder holds past its dot folders into the retro's input folder, and copies the transcripts, the memory and the scratchpads beside it
    by: anyone
    to: owner
    needs: ["retro"]
    reads: [[spec/guidance/retro/collect]]
    evidence:
      - name: run
        form: command
        expects: 0
        says: retro collect, which leaves the private folder holding .runtime and .retro alone
