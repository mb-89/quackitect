# The tree's retro.
# [[spec/design_input/the-agent-pulls-tickets#the-retro]]
for: a window of the record, and the changes to the machinery it earns
ask:
  - name: why
    form: text
    says: what calls for it, as notes standing open, an iteration ending, or the owner asking
steps:
  - name: feedback
    does: takes the owner's field feedback one point at a time, and writes each confirmed point as a private note
    by: person
    needs: ["ticket note"]
    tags: [retro, feedback]
    evidence:
      - name: notes
        form: list
        says: every private note this step writes, one a line
  - name: collect
    does: moves everything the private folder holds past its dot folders and .se/scripts into the retro's input folder, and copies .se/scripts, the transcripts, the memory and the scratchpads beside it
    by: anyone
    to: owner
    input: feedback
    needs: ["retro"]
    tags: [retro, collect]
    evidence:
      - name: run
        form: command
        expects: 0
        says: retro collect, which leaves the private folder holding .runtime, .retro and .se/scripts alone
  - name: effect
    does: counts the last retro's class patterns over this input, and says per class whether its failure still occurs and at what rate
    by: anyone
    input: collect
    needs: ["retro"]
    tags: [retro, effect]
    evidence:
      - name: effect
        form: command
        expects: 0
        says: retro effect, which answers each earlier class with its rate before and now
  - name: audit
    does: auditors walk the checklist over what the window lands, and write a findings column each
    by: anyone
    input: effect
    needs: ["retro", "retro audit"]
    tags: [retro, audit]
    checklist:
      - the code the window lands follows [[spec/guidance/code/code]]
      - every change lands with a test that fails before it and passes after, as [[spec/guidance/code/testing]] asks
      - every guarded rule of the code and testing guidance holds over the window, as [[spec/guidance/retro/audit]] asks
      - every test the window lands meets its behavior at the command line, as [[spec/guidance/code/testing]] asks
      - every verb, tab and door-facing feature the window lands has an example, and no test it lands asserts again what an example shows, as [[spec/guidance/code/examples]] asks
      - no module holds more test lines than code lines, and no test outlives its code or its phase, as [[spec/guidance/code/tests]] asks
      - every note the window writes holds the shape [[spec/guidance/guidance]] asks
      - the work follows [[spec/guidance/working]], a turn at a time
      - a change reaches every place holding the same thing, each writer, each copy and each name
      - the running system carries the change, rebuilt, restarted or reloaded
      - every claim to the owner rests on a check against what the owner sees
      - every mechanical step runs through a verb, and no hand repeats it
      - every piece of work lands in the place owning its topic
      - "no sentence the window writes says what the structure beside it holds: a count, a member, a link, a connection"
      - every experiment stands decided, which `retro audit` answers
      - every refusal teaches the hand, and no hand retries it blind
      - the battery's report reads beside the last retro's, and each part that grows has a finding, as [[spec/guidance/retro/effect]] asks
      - the chat's answers score under `answer.ceiling` in `spec/config/level0.json`, which `./RUNME.sh voice measure --transcripts` over the window's transcripts answers
    evidence:
      - name: audits
        form: list
        says: every audit findings file this step writes, one a line
      - name: trials
        form: command
        expects: 0
        says: retro audit, which answers 0 once every experiment stands decided
  - name: backlog
    does: reads every prose criterion a ticket the window closes carries, and writes each a verdict into backlog.json
    by: anyone
    input: audit
    needs: ["retro"]
    tags: [retro, backlog]
    evidence:
      - name: backlog
        form: command
        expects: 0
        says: retro backlog, which answers 0 once each prose criterion holds a verdict with its reason
  - name: chapter
    does: cuts the window into chapters of about six hours, and the engine hands every chapter its lines
    by: anyone
    input: backlog
    needs: ["retro"]
    tags: [retro, chapter]
    evidence:
      - name: chapters
        form: command
        expects: 0
        says: retro chapters, which refuses a gap or an overlap between two chapters
  - name: read
    does: one reader a chapter answers the five starfish questions and the five improvements, and the engine draws the matrix
    by: anyone
    input: chapter
    needs: ["retro"]
    tags: [retro, read, signals]
    evidence:
      - name: matrix
        form: command
        expects: 0
        says: retro matrix, which refuses a chapter standing without its findings
  - name: classify
    does: collapses the findings into class fixes with a rate each, gives every finding a disposition, and names every promotion
    by: anyone
    input: read
    needs: ["retro"]
    tags: [retro, classify]
    evidence:
      - name: classes
        form: command
        expects: 0
        says: retro classes, which counts each rate and refuses a finding with no disposition
  - name: check
    does: reads every class against the tree as it stands, closes the ones the tree answers already, writes each promotion its ticket, and draws the report again
    by: anyone
    to: owner
    input: classify
    needs: ["retro"]
    tags: [retro, check]
    evidence:
      - name: report
        form: command
        expects: 0
        says: retro matrix, which draws the report the owner reads, each status and promotion in it
  - name: report
    does: the owner reads the report, and passes the classes and promotions to mint, or sends the check back
    by: person
    on_fail: check
    input: check
    evidence:
      - name: verdict
        form: verdict
        says: pass once the report reads right, or fail with what the check changes, one a line
  - name: mint
    does: mints a ticket a class standing open and a promotion waiting, and opens each draft
    by: anyone
    input: report
    needs: ["retro"]
    tags: [retro, check]
    evidence:
      - name: minted
        form: command
        expects: 0
        says: retro mint, which refuses a class carrying no status or a promotion carrying no ticket, and mints the rest
