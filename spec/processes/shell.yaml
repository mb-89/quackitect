# The shell commands of a retro's window, grouped by the job and not one by
# one, read by one hand the engine spawns for it. A group that repeats is a
# tool the tree lacks, written out one command at a time.
# [[spec/design_input/the-agent-pulls-tickets#the-retro]]
name: shell
for: the shell commands of a retro's window, grouped by the job
ask:
  - name: groups
    form: list
    says: one line per group, with its count and one example, which collect writes
steps:
  - name: read
    does: says what the groups teach, and which become a verb, a sentence or a refusal
    from: engine
    by: helper
    input: ask
    to: retro
    evidence:
      - name: learn
        form: text
        says: what the groups say about what the tree lacks
      - name: tools
        form: list
        says: which groups become a verb or a flag, and which stay shell
      - name: guidance
        form: list
        says: which groups want a sentence, and where
      - name: block
        form: list
        says: which groups a door should refuse, and why
