# A group is the unit a box works and the unit that lands: a ticket under
# this process is a branch, work/<name>, and its children are the tickets
# naming it under group. The group's own leaves stand around the children,
# and this route is what a cloud run does, step by step.
# [[spec/design_input/the-agent-pulls-tickets#a-group-is-a-branch]]
name: group
for: a set of tickets one box works on one branch, which lands as one merge
ask:
  - name: goal
    form: text
    says: what these tickets add up to, for the hand that takes them
steps:
  - name: sync
    does: takes trunk into the branch, so the box works on the latest
    when: cloud
    by: agent
    needs: [work sync]
    evidence:
      - name: sync
        form: command
        expects: 0
        says: work sync, so the branch carries trunk
  - name: tickets
    by: tickets
  - name: retro
    reads: [[spec/guidance/working]]
    to: retro
    steps:
      - name: notes
        does: decides every private note on the box, and works what it mints into this group
        needs: [work retro]
        evidence:
          - name: drained
            form: command
            expects: 0
            says: work retro notes, which passes when the private folder is empty
      - name: write
        does: writes the retro over the box's own window
        input: [tickets, notes]
        evidence:
          - name: done
            form: list
            says: what was done, one line a ticket or a thing
          - name: well
            form: list
            says: what went well, and what made it go well
          - name: badly
            form: list
            says: what did not, each with its moment in the log or the transcript
          - name: improve
            form: list
            says: how each bad line stops happening, named by its home
          - name: thoughts
            form: text
            says: what the thoughts say that the actions do not, off the transcript
      - name: cloud
        does: names what the box lacked, met and leaves for a person
        when: cloud
        input: write
        evidence:
          - name: lacked
            form: list
            says: a tool, a host the proxy refused, a right the platform refused, an install, each with its moment
          - name: met
            form: list
            says: the trunk guard, a conflict at sync, the cap, a hook, a test that fails on the box alone
          - name: left
            form: list
            says: every person step parked, every ticket minted with no group, and what the handover says
