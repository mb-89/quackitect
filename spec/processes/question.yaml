# A question only a person answers, standing on a ticket of its own. `branch
# unblock` hands a group's person step here, so the group closes and the box
# leaves. The person answers on their own time, and the step behind the answer
# carries it out.
# [[spec/design_output/work#a-person-step-leaves]]
for: a question only a person answers, and the work the answer opens
ask:
  - name: question
    form: text
    says: what a person decides, and the ticket the question comes from
  - name: waits
    form: list
    says: one line each, naming what stands still until the answer lands
  - name: done_when
    form: list
    says: one line each, decidable, naming the command that decides it
steps:
  - name: answer
    does: answers the question the ask carries
    by: person
    to: engine
    input: ask
    evidence:
      - name: answer
        form: text
        says: the answer, which the step behind this one reads
  - name: do
    does: carries the answer out, with the test that covers it
    from: anyone
    by: anyone
    to: retro
    input: answer
    reads: [[spec/guidance/working]]
    needs: [branch test]
    checklist:
      - the change follows the answer, or the discussion says why it departs
      - the cleanup the change reveals is in the change, or is a note of its own
      - every fact the change adds stands in one place, and a note points at the file instead of repeating it
    evidence:
      - name: tests
        form: command
        expects: green
        says: the tests that cover the change, or the check where it touches no code
      - name: check
        form: command
        expects: 0
        says: the check is green on the commit
      - name: says
        form: text
        says: what changes and why, for a reader who was not there
