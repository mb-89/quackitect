# A change that wants an approach and its red tests first, a gate on them, and
# code after. The ask is the owner's words, the design phase turns them into an
# approach a reader can disagree with and tests that fail, and the rest
# implements it. A point the gate names rides out as a fix ticket, so the
# process goes on.
# [[spec/design_output/pull#the-gate]]
for: a change that wants an approach first, one review of it, and tests before code
ask:
  - name: gain
    form: text
    says: what is gained by doing it, and not only what it does
  - name: breaks
    form: text
    says: what breaks if it is never done
  - name: done_when
    form: list
    says: one line each, decidable, naming the command that decides it
  - name: view
    form: text
    says: the view the owner reads the change in and the number there, in the owner's words, or none
  - name: from
    form: text
    says: handover where the ask comes off a handover line, so the owner reads it first, or none
steps:
  - name: design
    reads: [[spec/guidance/voice]]
    steps:
      - name: owner-read
        does: reads the ask a handover carries, before any draft
        by: person
        when: handed
        input: ask
        evidence:
          - name: read
            form: verdict
            says: pass where the ask says what the owner said, or fail with the owner's words
      - name: draft
        does: writes the approach the ask calls for
        from: anyone
        by: anyone
        input: ask
        checklist:
          - every file, function and verb the approach names stands opened, and each claim checked there
          - the callers list names every caller of what the approach changes
          - every done_when line names the test that decides it
        evidence:
          - name: approach
            form: text
            says: the approach here where it takes minutes, or a link to the design output where it takes a note
          - name: callers
            form: list
            says: every caller of what the approach changes, one a line, as a file and a function
          - name: tests
            form: list
            says: every test the change adds, one a line, as a file and a test name
          - name: answers
            form: list
            says: every finding an earlier review names, one a line, with the answer the approach gives it, or first on a first draft
          - name: size
            form: list
            says: every file the approach touches, one a line
      - name: tests-red
        does: writes the tests the ask calls for
        reads: [[spec/guidance/code/testing]]
        needs: [branch test]
        input: draft
        checklist:
          - every done_when line meets a test that fails, or a checkpoint the hand answers where no command decides
          - every door the tests reach has a fake
        evidence:
          - name: tests
            form: command
            expects: assertion
            says: the tests you write fail on their own assertion
          - name: red
            form: list
            says: every test file standing red until tests-green closes, one a line, which the check leaves out
          - name: seen
            form: text
            says: what you see, and what surprises you
  - name: gate
    gate: does the approach answer the ask, and does a red test decide every done_when line
    does: reads the design phase against the ask, fixes what it finds within its own diff, and names the rest as points
    not: design/draft
    reads: [[spec/guidance/review/design]]
    input: [design/draft, design/tests-red]
    evidence:
      - name: verdict
        form: verdict
        says: accept, accept with points naming a fix ticket a line, or reject with findings one a line
  - name: implement
    reads: [[spec/guidance/code/testing]]
    needs: [branch test]
    input: [design/draft, gate]
    checklist:
      - the change touches no file the ask leaves out
      - every door the change reaches has a fake
      - a comment names the approach the change implements
      - every fact the change adds stands in one place, and a note points at the file instead of repeating it
    steps:
      - name: change
        does: makes the change
        reads: [[spec/guidance/code/code]]
        evidence:
          - name: lint
            form: command
            expects: 0
            says: the tree builds and lints
      - name: tests-green
        does: makes the tests pass
        input: design/tests-red
        to: retro
        evidence:
          - name: tests
            form: command
            expects: green
            says: the same tests pass
          - name: check
            form: command
            expects: 0
            says: the check is green on the commit
          - name: says
            form: text
            says: what changes and why, for a reader who was not there
  - name: accept
    gate: does the whole work answer the ask, and does every command of the route pass
    final: true
    when: backlog
    does: reads the diff since its last verdict against the ask and every prose criterion, and names what falls short as points
    not: implement/change
    reads: [[spec/guidance/review/design]]
    input: [ask, implement]
    evidence:
      - name: verdict
        form: verdict
        says: accept, accept with points naming a fix ticket a line, or reject with findings one a line
  - name: view
    does: reads the change in the view the ask names
    by: person
    when: view
    on_fail: implement
    to: retro
    input: [ask, implement/tests-green]
    evidence:
      - name: seen
        form: verdict
        says: pass where the view shows the ask's number, or fail with what it shows
