# A change that wants an approach first, one review of it, and tests before
# code. The ask is the owner's words, the design phase turns them into an
# approach a reader can disagree with, and the rest implements it. A finding
# the review names rides out as a child ticket, so the parent goes on.
# [[spec/design_output/pull#a-finding-rides-out]]
for: a change that wants an approach first, one review of it, and tests before code
ask:
  - name: gain
    form: text
    says: what is gained by doing it, and not only what it does
  - name: breaks
    form: text
    says: what breaks if it is never done
  - name: done_when
    form: list
    says: one line each, decidable, naming the command that decides it
steps:
  - name: design
    reads: [[spec/guidance/voice]]
    steps:
      - name: draft
        does: writes the approach the ask calls for
        from: anyone
        by: anyone
        input: ask
        checklist:
          - every file, function and verb the approach names stands opened, and each claim checked there
          - the callers list names every caller of what the approach changes
          - every done_when line names the test that decides it
        evidence:
          - name: approach
            form: text
            says: the approach here where it takes minutes, or a link to the design output where it takes a note
          - name: callers
            form: list
            says: every caller of what the approach changes, one a line, as a file and a function
          - name: tests
            form: list
            says: every test the change adds, one a line, as a file and a test name
          - name: answers
            form: list
            says: every finding an earlier review names, one a line, with the answer the approach gives it, or first on a first draft
          - name: size
            form: list
            says: every file the approach touches, one a line
      - name: review
        does: reads the approach against the ask
        not: draft
        on_fail: draft
        reads: [[spec/guidance/review/design]]
        input: design/draft
        evidence:
          - name: verdict
            form: verdict
            says: pass, pass with findings naming a child a line, or fail with findings one a line
  - name: implement
    reads: [[spec/guidance/code/testing]]
    needs: [branch test]
    input: [design/draft, design/review]
    checklist:
      - the change touches no file the ask leaves out
      - every door the change reaches has a fake
      - a comment names the approach the change implements
      - every fact the change adds stands in one place, and a note points at the file instead of repeating it
      - every row the design review passes with stands fixed in the change
    steps:
      - name: tests-red
        does: writes the tests the ask calls for
        evidence:
          - name: tests
            form: command
            expects: assertion
            says: the tests you write fail on their own assertion
          - name: seen
            form: text
            says: what you see, and what surprises you
      - name: change
        does: makes the change
        reads: [[spec/guidance/code/code]]
        evidence:
          - name: lint
            form: command
            expects: 0
            says: the tree builds and lints
      - name: tests-green
        does: makes the tests pass
        input: tests-red
        to: retro
        evidence:
          - name: tests
            form: command
            expects: green
            says: the same tests pass
          - name: check
            form: command
            expects: 0
            says: the check is green on the commit
          - name: says
            form: text
            says: what changes and why, for a reader who was not there
