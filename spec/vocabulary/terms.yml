  - {word: node, defines: "[[spec/design_output/config]]", means: "the program that runs the javascript of this tree outside a browser", source: "https://nodejs.org"}
  - {word: note, defines: "[[spec/design_output/schema]]", means: "a markdown file of one kind that its schema governs"}
