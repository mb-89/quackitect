  - {word: log, defines: "[[spec/design_output/log]]", means: "the file of lines each door writes per session which the viewer shows and a retro reads"}
  - {word: manifest, defines: "[[spec/design_output/apply]]", means: "the full list of edit steps one patch call carries which lands whole or not at all"}
