# The terms: the words this tree writes past the core, each with the note that
# defines it. A word with no defining note is jargon, and the door refuses it.
# A person adds a term, or a session adds one together with the note.
# [[spec/schemas/paragraph.schema.yaml]]

terms:
  - {word: splice, defines: "[[spec/design_input/the-agent-pulls-tickets]]", means: "to insert rows or steps into a list at a given place and push the rest along"}
  - {word: bridgehead, defines: "[[spec/design_output/vehicle#two-roads-to-the-vehicle]]", means: "the one hook module a project carries which posts every event to the server and finds the vehicle"}
  - {word: shim, defines: "[[spec/design_output/vehicle#two-roads-to-the-vehicle]]", means: "the small shell run script in a stub that finds the vehicle and hands it every argument"}
  - {word: stub, defines: "[[spec/design_output/vehicle#a-stub-takes-its-vehicle]]", means: "a bare project the method drives from outside which the vehicle writes out without copying itself"}
  - {word: agent, defines: "[[spec/guidance/voice]]", means: "the model that works the tree in a session and meets every door a person meets"}
  - {word: answer, defines: "[[spec/design_output/level0#the-gate-reads-the-answer]]", means: "the reply a session writes at the end of a turn which the gate reads and scores"}
  - {word: apply, defines: "[[spec/design_output/apply]]", means: "to write a checked set of file edits at once where one failure refuses the whole set"}
  - {word: artifact, defines: "[[spec/design_output/extension]]", means: "a file a build or a run produces and keeps such as a bundled script or a report"}
  - {word: assertion, defines: "[[spec/guidance/code/testing]]", means: "a check inside a test that states what must hold and fails the test when it does not"}
  - {word: battery, defines: "[[spec/design_output/work#the-battery-answers-first]]", means: "the full set of tests and checks the check verb runs whose result every push must pass"}
  - {word: binary, defines: "[[spec/design_output/index#the-compiler-it-needs]]", means: "a built program file that runs on its own such as the index server"}
  - {word: binding, defines: "[[spec/design_output/level0#the-owner-binds-god]]", means: "the setting that says how hard the doors hold where god lets every refusal through"}
  - {word: biome, defines: "[[spec/design_output/config]]", means: "the formatter and linter that reads and rewrites javascript and json in this tree", source: "https://biomejs.dev"}
  - {word: bottom line, defines: "[[spec/guidance/voice]]", means: "the main point a reader acts on which goes first with the detail under it"}
  - {word: single point of truth, defines: "[[spec/guidance/voice]]", means: "the rule to state a thing in one place and link to it everywhere else"}
  - {word: self-evident, defines: "[[spec/guidance/voice]]", means: "plain from the structure beside it so a sentence saying it adds nothing"}
  - {word: box, defines: "[[spec/design_output/vehicle]]", means: "the machine a session runs on such as a cloud container or a laptop at a desk"}
  - {word: branch, defines: "[[spec/design_output/work#what-a-work-branch-is]]", means: "a git line of work that holds one piece of work and carries its group ticket"}
  - {word: cage, defines: "[[spec/design_output/level0#the-write-door]]", means: "the set of level zero doors that hold a session and refuse writes breaking a rule"}
  - {word: canary, defines: "[[spec/design_output/level0#the-canary]]", means: "the opening line of an answer saying level zero holds the session with its rule counts"}
  - {word: inset, defines: "[[spec/design_input/the-editor-draws-the-ticket#one-file-holds-both-halves]]", means: "a web view the editor draws between the lines of a text file to show the ticket drawing"}
  - {word: canvas, defines: "[[spec/design_input/the-agent-pulls-tickets#the-drawing-is-a-projection]]", means: "the drawing surface in the editor where a route shows as blocks and wires a person can edit"}
  - {word: cap, defines: "[[spec/design_output/level0#the-cap-counts-the-prose]]", means: "the most words an answer may hold outside fences and tables before it meets a rewrite"}
  - {word: chapter, defines: "[[spec/design_output/schema]]", means: "a section of a note under a top level heading that its schema names"}
  - {word: checker, defines: "[[spec/design_output/schema#the-reader-and-the-checker]]", means: "the program part that weighs a note against its schema and answers one finding per departure"}
  - {word: checklist, defines: "[[spec/design_output/schema]]", means: "a list of items a step carries which the hand checks off one line each in its evidence"}
  - {word: claim, defines: "[[spec/design_output/stop#the-claim-rides-the-call]]", means: "the reason an agent gives through the stop tool to end a turn which the tooth confirms"}
  - {word: client, defines: "[[spec/design_output/lsp]]", means: "a program that asks a server for work such as the agent harness or the editor extension"}
  - {word: clone, defines: "[[spec/design_output/level0#what-level-zero-is]]", means: "a full copy of the repository on a box made with git"}
  - {word: cloud, defines: "[[spec/guidance/cloud]]", means: "a remote box where a session runs alone with nobody beside it to answer"}
  - {word: commit, defines: "[[spec/design_output/bash]]", means: "a saved snapshot of changes in git with a message that the door checks for voice"}
  - {word: compaction, defines: "[[spec/design_output/level0#the-layer-after-a-compaction]]", means: "the harness shrinking a long conversation into a summary so the session keeps going"}
  - {word: compiler, defines: "[[spec/design_output/index#the-compiler-it-needs]]", means: "a program that turns source code into a binary such as the c compiler the index build needs"}
  - {word: config, defines: "[[spec/design_output/config]]", means: "the numbers and switches this tree holds which one resolver reads from layered files and the environment"}
  - {word: contract, defines: "[[spec/design_output/doors]]", means: "a test that drives the real thing behind a door and checks its fake answers the same"}
  - {word: copilot, defines: "[[spec/design_output/copilot]]", means: "the coding agent of a hosted git service that runs as a second surface under the same level zero doors", source: "https://github.com/features/copilot"}
  - {word: desk, defines: "[[spec/design_output/work#a-box-off-a-branch]]", means: "a session a person runs by hand outside a cloud box which hands person steps out"}
  - {word: dispatch, defines: "[[spec/design_output/copilot]]", means: "to send a work branch to a copilot worker as a draft pull request"}
  - {word: door, defines: "[[spec/design_output/doors]]", means: "the one place the tree reaches or guards an outside thing and refuses what breaks a rule"}
  - {word: draft, defines: "[[spec/design_output/level0#the-tool-reads-a-draft]]", means: "an answer written before it goes out which a tool checks against the voice rules"}
  - {word: editor, defines: "[[spec/design_output/editor]]", means: "the code editor a person works in which draws findings and the ticket drawing as they type"}
  - {word: engine, defines: "[[spec/design_input/the-agent-pulls-tickets#three-rules-hold-level-one]]", means: "the part that hands out the next ticket by rules and checks every hand back"}
  - {word: escalate, defines: "[[spec/design_output/pull#a-person-step-goes-in]]", means: "to hand a question the agent cannot settle to the owner by inserting a person step"}
  - {word: evidence, defines: "[[spec/schemas/ticket.schema]]", means: "the fields a hand fills at a step in set forms which the engine checks"}
  - {word: extension, defines: "[[spec/design_output/extension]]", means: "the editor add on that draws the tree sidebar and the ticket drawing"}
  - {word: fake, defines: "[[spec/design_output/doors]]", means: "a stand in for a door that works in memory so a test touches nothing outside"}
  - {word: fault, defines: "[[spec/design_output/schema]]", means: "a departure a check finds such as a missing key or a value of the wrong shape"}
  - {word: fence, defines: "[[spec/schemas/paragraph.schema]]", means: "a block of code set off from the prose which the voice rules skip"}
  - {word: field, defines: "[[spec/schemas/ticket.schema]]", means: "a named slot in a ticket that holds one value or one piece of evidence"}
  - {word: finding, defines: "[[spec/design_output/level0#the-write-door]]", means: "one rule break a check reports naming the rule and the file and the line"}
  - {word: fixture, defines: "[[spec/guidance/code/testing]]", means: "shared test data or setup that tests read and never write"}
  - {word: formatter, defines: "[[spec/design_output/level0#the-formatter-applies-itself]]", means: "a tool that rewrites code into one standard layout without asking such as biome"}
  - {word: frontmatter, defines: "[[spec/design_output/schema]]", means: "the block of yaml keys at the top of a note before its body"}
  - {word: funnel, defines: "[[spec/funnel]]", means: "a note that holds an open question the owner weighs with the options and what each costs"}
  - {word: gate, defines: "[[spec/design_output/level0#the-gate-reads-the-answer]]", means: "the end of turn check that scores an answer and asks for a rewrite past a limit"}
  - {word: git, defines: "[[spec/design_output/bash]]", means: "the version control program that records commits and branches of this tree", source: "https://git-scm.com"}
  - {word: glob, defines: "[[spec/design_output/index#a-type-is-a-glob]]", means: "a file name pattern with wildcards that names a family of files"}
  - {word: god mode, defines: "[[spec/design_output/level0#the-owner-binds-god]]", means: "the binding that lets every refusal and hold through and leaves only a debug line"}
  - {word: grammar, defines: "[[spec/schemas/paragraph.schema]]", means: "the rules for how a sentence may be built such as which tenses and modals it may use"}
  - {word: graph, defines: "[[spec/design_input/the-agent-pulls-tickets]]", means: "the nodes and edges an emitter reads out of a route which the editor draws"}
  - {word: group, defines: "[[spec/design_output/work#a-group-is-a-ticket]]", means: "a ticket whose work is other tickets and which rides its own work branch"}
  - {word: guidance, defines: "[[spec/guidance/guidance]]", means: "a note of numbered rules that tells the reader what to do next"}
  - {word: hand, defines: "[[spec/design_output/work#the-take-writes-the-record]]", means: "the agent or person or box that does the work at a step and signs the record"}
  - {word: handback, defines: "[[spec/design_output/review]]", means: "the ticket as a branch carries it at done with the evidence each step fills"}
  - {word: handover, defines: "[[spec/design_output/work#one-handover-stands]]", means: "a private file a session leaves for the next session on the box which reads it once"}
  - {word: harness, defines: "[[spec/design_output/level0#the-harness-surface]]", means: "the agent client that runs a session and fires the hooks level zero listens to"}
