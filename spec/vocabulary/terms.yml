# The terms: the words this tree writes past the core, each with one line that
# says what it means in core words and other terms. The dictionary is the
# source, so a term points at no note in the tree, and cites an outside source
# by its address.
# [[spec/schemas/paragraph.schema.yaml]]

terms:
  - {word: splice, means: "to insert rows or steps into a list at a given place and push the rest along"}
  - {word: bridgehead, means: "the one hook module a project carries which posts every event to the server and finds the vehicle"}
  - {word: shim, means: "the small shell run script in a stub that finds the vehicle and hands it every argument"}
  - {word: stub, means: "a bare project the method drives from outside which the vehicle writes out without copying itself"}
  - {word: agent, means: "the model that works the tree in a session and meets every door a person meets"}
  - {word: answer, means: "the reply a session writes at the end of a turn which the gate reads and scores"}
  - {word: apply, means: "to write a checked set of file edits at once where one failure refuses the whole set"}
  - {word: artifact, means: "a file a build or a run produces and keeps such as a bundled script or a report"}
  - {word: assertion, means: "a check inside a test that states what must hold and fails the test when it does not"}
  - {word: battery, means: "the full set of tests and checks the check verb runs whose result every push must pass"}
  - {word: binary, means: "a built program file that runs on its own such as the index server"}
  - {word: binding, means: "the setting that says how hard the doors hold where god lets every refusal through"}
  - {word: biome, means: "the formatter and linter that reads and rewrites javascript and json in this tree", source: "https://biomejs.dev"}
  - {word: bottom line, means: "the main point a reader acts on which goes first with the detail under it"}
  - {word: single point of truth, means: "the rule to state a thing in one place and link to it everywhere else"}
  - {word: self-evident, means: "plain from the structure beside it so a sentence saying it adds nothing"}
  - {word: box, means: "the machine a session runs on such as a cloud container or a laptop at a desk"}
  - {word: branch, means: "a git line of work that holds one piece of work and carries its group ticket"}
  - {word: cage, means: "the set of level zero doors that hold a session and refuse writes breaking a rule"}
  - {word: canary, means: "the opening line of an answer saying level zero holds the session with its rule counts"}
  - {word: inset, means: "a web view the editor draws between the lines of a text file to show the ticket drawing"}
  - {word: canvas, means: "the drawing surface in the editor where a route shows as blocks and wires a person can edit"}
  - {word: cap, means: "the most words an answer may hold outside fences and tables before it meets a rewrite"}
  - {word: chapter, means: "a section of a note under a top level heading that its schema names"}
  - {word: checker, means: "the program part that weighs a note against its schema and answers one finding per departure"}
  - {word: checklist, means: "a list of items a step carries which the hand checks off one line each in its evidence"}
  - {word: claim, means: "the reason an agent gives through the stop tool to end a turn which the tooth confirms"}
  - {word: client, means: "a program that asks a server for work such as the agent harness or the editor extension"}
  - {word: clone, means: "a full copy of the repository on a box made with git"}
  - {word: cloud, means: "a remote box where a session runs alone with nobody beside it to answer"}
  - {word: commit, means: "a saved snapshot of changes in git with a message that the door checks for voice"}
  - {word: compaction, means: "the harness shrinking a long conversation into a summary so the session keeps going"}
  - {word: compiler, means: "a program that turns source code into a binary such as the c compiler the index build needs"}
  - {word: config, means: "the numbers and switches this tree holds which one resolver reads from layered files and the environment"}
  - {word: contract, means: "a test that drives the real thing behind a door and checks its fake answers the same"}
  - {word: copilot, means: "the coding agent of a hosted git service that runs as a second surface under the same level zero doors", source: "https://github.com/features/copilot"}
  - {word: desk, means: "a session a person runs by hand outside a cloud box which hands person steps out"}
  - {word: dispatch, means: "to send a work branch to a copilot worker as a draft pull request"}
  - {word: door, means: "the one place the tree reaches or guards an outside thing and refuses what breaks a rule"}
  - {word: draft, means: "an answer written before it goes out which a tool checks against the voice rules"}
  - {word: editor, means: "the code editor a person works in which draws findings and the ticket drawing as they type"}
  - {word: engine, means: "the part that hands out the next ticket by rules and checks every hand back"}
  - {word: escalate, means: "to hand a question the agent cannot settle to the owner by inserting a person step"}
  - {word: evidence, means: "the fields a hand fills at a step in set forms which the engine checks"}
  - {word: extension, means: "the editor add on that draws the tree sidebar and the ticket drawing"}
  - {word: fake, means: "a stand in for a door that works in memory so a test touches nothing outside"}
  - {word: fault, means: "a departure a check finds such as a missing key or a value of the wrong shape"}
  - {word: fence, means: "a block of code set off from the prose which the voice rules skip"}
  - {word: field, means: "a named slot in a ticket that holds one value or one piece of evidence"}
  - {word: finding, means: "one rule break a check reports naming the rule and the file and the line"}
  - {word: fixture, means: "shared test data or setup that tests read and never write"}
  - {word: formatter, means: "a tool that rewrites code into one standard layout without asking such as biome"}
  - {word: frontmatter, means: "the block of yaml keys at the top of a note before its body"}
  - {word: funnel, means: "a note that holds an open question the owner weighs with the options and what each costs"}
  - {word: gate, means: "the end of turn check that scores an answer and asks for a rewrite past a limit"}
  - {word: git, means: "the version control program that records commits and branches of this tree", source: "https://git-scm.com"}
  - {word: glob, means: "a file name pattern with wildcards that names a family of files"}
  - {word: god mode, means: "the binding that lets every refusal and hold through and leaves only a debug line"}
  - {word: grammar, means: "the rules for how a sentence may be built such as which tenses and modals it may use"}
  - {word: graph, means: "the nodes and edges an emitter reads out of a route which the editor draws"}
  - {word: group, means: "a ticket whose work is other tickets and which rides its own work branch"}
  - {word: guidance, means: "a note of numbered rules that tells the reader what to do next"}
  - {word: hand, means: "the agent or person or box that does the work at a step and signs the record"}
  - {word: handback, means: "the ticket as a branch carries it at done with the evidence each step fills"}
  - {word: handover, means: "a private file a session leaves for the next session on the box which reads it once"}
  - {word: harness, means: "the agent client that runs a session and fires the hooks level zero listens to"}
  - {word: hash, means: "a short fingerprint of a file or commit that changes whenever its content changes"}
  - {word: helper, means: "a subagent a session spawns which gets the session guidance and meets the same doors"}
  - {word: heredoc, means: "a block of text written inline in a shell command and fed to that command as input"}
  - {word: hook, means: "a function the harness calls at an event such as a tool call or a turn end"}
  - {word: index, means: "the database over this tree that a watcher keeps warm and that answers searches fast"}
  - {word: installer, means: "the script that sets up the tools a build needs and downloads a missing compiler"}
  - {word: leaf, means: "a step with no steps under it and the only thing a pull hands out"}
  - {word: level zero, means: "the plugin holding every door that guards the agent from the first turn of a clone"}
  - {word: level one, means: "the ticket system where the agent pulls a ticket and works it and hands it back"}
  - {word: lint, means: "to check a file or message against the style rules and report each break"}
  - {word: linter, means: "a program that checks text or code against style rules and names each break"}
  - {word: log, means: "the file of lines each door writes per session which the viewer shows and a retro reads"}
  - {word: manifest, means: "the full list of edit steps one patch call carries which lands whole or not at all"}
  - {word: markdown, means: "the plain text format every note uses with marks for headings and lists and links", source: "https://daringfireball.net/projects/markdown/"}
  - {word: merge, means: "to join a finished work branch into main once its tickets agree and the check passes"}
  - {word: mint, means: "to write a new note from the schema of its kind so the checker passes it"}
  - {word: modal, means: "a helping verb such as can or must or will that a paragraph may use"}
  - {word: module, means: "a single code file that other code loads and that holds one piece of the logic"}
  - {word: node, means: "the program that runs the javascript of this tree outside a browser", source: "https://nodejs.org"}
  - {word: note, means: "a markdown file of one kind that its schema governs"}
  - {word: orphan, means: "a branch that shares no history with main so no sync or merge reaches it"}
  - {word: owner, means: "the person the tree works for who gives the asks and makes the rulings"}
  - {word: pane, means: "the right half of the viewer window that shows the help or the filter"}
  - {word: panel, means: "an editor area that draws one view such as the sidebar page or the problems list"}
  - {word: paragraph, means: "a run of sentences in prose that the voice rules cap and shape"}
  - {word: parse, means: "to split text into its parts so a program can read each part"}
  - {word: plugin, means: "a package the harness loads that adds hooks and tools to a session"}
  - {word: probe, means: "a verb that runs the client headless to prove the guidance survives a compaction"}
  - {word: process, means: "a route template the mint copies onto a new ticket"}
  - {word: projection, means: "a target file the engine writes from one source so nobody copies by hand"}
  - {word: projector, means: "the part of the engine that writes each source into every target it names"}
  - {word: prompt, means: "a message a person sends that opens a turn and that the session owes an answer"}
  - {word: prose, means: "plain running text in sentences as opposed to code or tables"}
  - {word: pull, means: "the verb that hands the agent a ticket at a step and takes it back with a verdict"}
  - {word: queue, means: "the ordered list of tickets and todos waiting for a hand to take them"}
  - {word: rationale, means: "a note holding the argument behind a guidance note so the rule itself stays short"}
  - {word: readback, means: "the answer a session owes the owner for a prompt before it goes on working"}
  - {word: record, means: "the list in a ticket that holds one entry per step a hand takes"}
  - {word: refactor, means: "to change how a thing reads or is shaped while its meaning and behavior stay the same"}
  - {word: refactorer, means: "a hand spawned beside the session that drains warnings and changes no meaning"}
  - {word: refactoring, means: "work that reshapes code or prose to cost a reader less and keeps its meaning"}
  - {word: refusal, means: "the answer a door gives when it denies a write and names the rule and line"}
  - {word: refuse, means: "to deny a write or command and name the rule it breaks"}
  - {word: register, means: "a set of voice rules that overrides the defaults for the files it names"}
  - {word: render, means: "to draw a note or its record as lines a person reads"}
  - {word: repo, means: "the git repository that holds this tree and its history"}
  - {word: retro, means: "the process that reads a window of the record and earns changes to the machinery"}
  - {word: reviewer, means: "the role that reads a branch at done against its ask and hands back a list of fixes"}
  - {word: root, means: "a top folder a vehicle knows such as the method root or the work root"}
  - {word: route, means: "the tree of steps a ticket carries which the pull walks leaf by leaf"}
  - {word: routine, means: "a saved trigger that starts a cloud session with one fixed prompt"}
  - {word: runtime, means: "the program that runs the level zero doors for another agent surface"}
  - {word: sandbox, means: "a closed space where a worker runs with limited access to the rest of the system"}
  - {word: schema, means: "a file that says which fields and chapters a note of one kind holds"}
  - {word: scope, means: "the field that names which files or readers a guidance note covers"}
  - {word: session, means: "one run of the agent in the harness from its first prompt to its end"}
  - {word: shell, means: "the command line program that runs the commands the agent types"}
  - {word: sidebar, means: "the view the editor extension draws beside the files to show and set the tree values"}
  - {word: slash command, means: "a command a person types in the chat after a forward slash to run a stored prompt"}
  - {word: spawn, means: "the moment a session starts a subagent which a hook can catch to rewrite its prompt"}
  - {word: stale, means: "said of a held branch whose tip is past the set age so a person must decide"}
  - {word: stamp, means: "the record the check writes on each run naming the commit and whether it passes"}
  - {word: standing layer, means: "the blocks of guidance and handover that the first message of each conversation carries"}
  - {word: stop, means: "the end of a turn when the model stops writing and the hook decides whether work goes on"}
  - {word: subagent, means: "a helper agent a session starts for one job which fires no session start of its own"}
  - {word: sweep, means: "one pattern replaced across every file a glob reaches in a single pass"}
  - {word: swap, means: "a word the core leaves out paired with the core word to write in its place"}
  - {word: tagger, means: "the program that marks each word with its part of speech so a rule can read tense"}
  - {word: take, means: "to claim a group of work by writing the box and branch tip into its record"}
  - {word: term, means: "a word this tree uses beyond the core with one line that says what it means"}
  - {word: terminal, means: "the text window where a person runs commands and where the viewer draws"}
  - {word: ticket, means: "a file that holds one piece of work with its route of steps and its record"}
  - {word: token, means: "a small unit of text such as a word or part of one that a rule reads"}
  - {word: tooth, means: "the check that reads the end of a turn and decides whether the session goes on"}
  - {word: transcript, means: "the full written record of the messages and calls in a session"}
  - {word: tree, means: "a folder with all the files under it such as the method tree or the work tree"}
  - {word: trunk, means: "the main branch that every work branch starts from and merges back into"}
  - {word: tui, means: "a text user interface that draws a window of rows inside a terminal"}
  - {word: urgent, means: "a mark on a ticket that puts its branch first when the next work is taken"}
  - {word: vale, means: "a prose linter that checks text against style rules and which the write door runs first", source: "https://vale.sh"}
  - {word: ini, means: "a plain settings file made of sections and key value lines such as the vale settings file"}
  - {word: vehicle, means: "the copy of this tooling that another project carries and that drives the work there"}
  - {word: verb, means: "a named command the tool runs such as a command that acts on a work branch"}
  - {word: verdict, means: "a pass or fail answer that a review step gives with its findings"}
  - {word: verify, means: "to check a thing against the spec it answers such as a test that checks a requirement"}
  - {word: validate, means: "to check a thing against the need of the person it serves such as a demonstration that checks a story"}
  - {word: viewer, means: "the program that shows the session log as rows in a terminal window"}
  - {word: vocabulary, means: "the full set of words this tree lets a writer use made of the core and the terms"}
  - {word: watcher, means: "the part that watches the folders for writes and keeps the index rows level with the files"}
  - {word: webview, means: "a panel inside the editor that shows a web page drawn by the extension"}
  - {word: widget, means: "one control on the settings page such as a toggle or a text box that draws a value"}
  - {word: worker, means: "the remote agent that does the work on one branch inside its own sandbox"}
  - {word: workspace, means: "the folder the editor opens as a project and which relative paths start from"}
  - {word: worktree, means: "a second checkout of a branch in its own folder beside the main one", source: "https://git-scm.com/docs/git-worktree"}
  - {word: actionable, means: "said of a line that tells the reader what to do next"}
  - {word: applier, means: "the part that makes an edit or replace land in the files and records how to undo it"}
  - {word: backlog, means: "the loose tickets on trunk that name no group and wait for a person to sort them"}
  - {word: backslash, means: "the character that escapes the next character in a shell command"}
  - {word: blacklist, means: "a list of forms a rule refuses inside a larger list of allowed words"}
  - {word: breadcrumb, means: "one step in the path shown on top of a view that a click jumps back to"}
  - {word: breadcrumbs, means: "the path of steps shown on top of a view from the start page down to where the reader stands"}
  - {word: bundler, means: "a tool that joins the extension source files into one file the editor loads"}
  - {word: caller, means: "the code or agent that calls a tool and states what it expects back"}
  - {word: cgo, means: "the go feature that lets go code call c code and so needs a c compiler to build", source: "https://pkg.go.dev/cmd/cgo"}
  - {word: dispatcher, means: "the side that hands work to a worker and holds the credentials the worker must not get"}
  - {word: emitter, means: "the one module that reads a process file and writes the drawing the editor shows"}
  - {word: emoji, means: "a small picture character that the paragraph rules refuse in prose"}
  - {word: enabler, means: "what a step must have to run such as the notes it reads and the tools it needs"}
  - {word: ellipsis, means: "three dots that mark words left out which the paragraph rules refuse"}
  - {word: fixer, means: "the part that rewrites a refused shell command into a form the door lets through"}
  - {word: headless, means: "run with no window or person at the keys so a script drives the client"}
  - {word: hover, means: "to rest the pointer over an item so the editor shows its help sentence"}
  - {word: hyphen, means: "the short dash that joins two words into one which a rule counts as a single word"}
  - {word: idempotent, means: "said of an action that gives the same result when sent once or many times"}
  - {word: indent, means: "the spaces at the start of a line that show which map or list it belongs to"}
  - {word: kebab, means: "a way to write names in lower case with a dash between the words"}
  - {word: lexer, means: "the part that cuts a shell command into words quotes and operators before the rules read it"}
  - {word: lookahead, means: "reading the next token before deciding what the current token means"}
  - {word: millisecond, means: "one part in a thousand of a second which each log row stamp counts to"}
  - {word: minter, means: "the tool that writes a new note from its schema and checks it before it lands"}
  - {word: newline, means: "the character that ends a line and which cuts a shell command into separate segments"}
  - {word: nonce, means: "a random value made once per page load that lets only the named script run in the webview"}
  - {word: openste, means: "an open seed list of simple technical english words that the core word list builds on"}
  - {word: participle, means: "the verb form ending in ed or ing that the grammar rules read to find tense"}
  - {word: placeholder, means: "the stand-in text mint writes for a field left out which the checker names until someone fills it"}
  - {word: quackitect, means: "this tree as a whole which holds the method and the tools that check and draw it"}
  - {word: redraw, means: "to draw the whole panel again from the state after a click or a change on disk"}
  - {word: regex, means: "a text pattern that finds and replaces matching words across the files a glob reaches"}
  - {word: renderer, means: "the code that turns a record or a state into the lines a person sees"}
  - {word: resolver, means: "the code that answers the value of a setting by reading the schema and the per box file"}
  - {word: retry, means: "to try a failed step again while keeping the same identity so no duplicate lands"}
  - {word: ripgrep, means: "a fast search program whose regexp engine and glob habits the index copies", source: "https://github.com/BurntSushi/ripgrep"}
  - {word: runme, means: "the installer script a person runs once to link the tools and the editor panel into a box"}
  - {word: scratchpad, means: "a private folder for temporary files that belong to one session and not to the tree"}
  - {word: semicolon, means: "a punctuation mark that the paragraph rules count and limit in prose"}
  - {word: serialize, means: "to turn a value held in memory into text that can be written to a file"}
  - {word: shebang, means: "the first line of a script that names the program which runs it"}
  - {word: sipoc, means: "the form a route step fills naming its supplier and input and process and output and customer"}
  - {word: stdin, means: "the input stream a program reads when text is piped into it"}
  - {word: stdio, means: "the plain input and output streams the editor and the language server talk over"}
  - {word: subcommand, means: "a second word after a command name that picks which action the command takes"}
  - {word: throwaway, means: "made for one use and then deleted without being kept in the tree"}
  - {word: underscore, means: "the low line mark used to join words in a name where a space cannot stand"}
  - {word: validator, means: "the code that checks a value against the schema and refuses one of the wrong type"}
  - {word: whitelist, means: "a list of the only things allowed where anything missing from it is refused"}
  - {word: whitespace, means: "spaces and tabs and line breaks that separate words and carry no text of their own"}
  - {word: wildcard, means: "a mark in a glob such as a star that stands for any run of characters"}
  - {word: yaml, means: "a plain text format for nested data which schemas and notes in this tree use", source: "https://yaml.org"}
  - {word: json, means: "a plain text format for data in braces that runtime and config files use", source: "https://www.json.org"}
  - {word: animate, means: "to move part of the panel smoothly over a short time instead of at once"}
  - {word: authenticate, means: "to prove to a service who you are so it accepts your requests"}
  - {word: backspace, means: "the control character that a double quoted string reads from a backslash and the letter b"}
  - {word: coerce, means: "to turn a typed value into the type the schema names such as text into a number"}
  - {word: collapsible, means: "able to fold shut and open again so a panel section hides or shows its rows"}
  - {word: deterministic, means: "giving the same output every time from the same input with no chance involved"}
  - {word: egress, means: "network traffic leaving a sandbox or box toward the outside world"}
  - {word: enumerate, means: "to list every allowed value of a field one by one"}
  - {word: ephemeral, means: "short lived and thrown away when the job ends so nothing on it lasts"}
  - {word: escalation, means: "a route step that hands a question the agent cannot settle up to a person"}
  - {word: flatten, means: "to turn raw text into plain lower case words so every door compares the same form"}
  - {word: guardrail, means: "a check at the write door that refuses a write breaking a rule before it lands"}
  - {word: gutter, means: "the narrow strip at the left edge of a row where the selection bar is drawn"}
  - {word: ideation, means: "the early stage of coming up with and weighing ideas before any design is fixed"}
  - {word: inherit, means: "to take on the guidance and settings of the method tree without copying them"}
  - {word: inject, means: "to put extra text or values into a prompt or a process from outside it"}
  - {word: interpolate, means: "to insert the value of a variable into a string or a command line"}
  - {word: loopback, means: "the network address that reaches only the same machine so no outside box can connect"}
  - {word: modifier, means: "a schema keyword that rides on a field and changes how the checker treats it"}
  - {word: msvc, means: "the microsoft compiler and its tools that one windows build target of the editor tools is made with"}
  - {word: mutate, means: "to change a thing in place rather than making a new copy"}
  - {word: orchestration, means: "the code that calls the doors in order and passes results between them"}
  - {word: powershell, means: "the microsoft command shell a windows person types into to run the installer", source: "https://learn.microsoft.com/powershell/"}
  - {word: prepend, means: "to add text at the front of something such as the standing text before a spawn prompt"}
  - {word: provenance, means: "where a claim or a piece of text comes from and who stands behind it"}
  - {word: recursion, means: "a check that calls itself on each nested part until every level is read"}
  - {word: regexp, means: "a regular expression which is a text pattern the index turns a glob into for matching"}
  - {word: ruleset, means: "the repository settings that name the checks and approvals a change needs before it merges"}
  - {word: truncate, means: "to cut text or a file short at a set length and drop the rest"}
  - {word: vscode, means: "the code editor whose sidebar panel draws this tree", source: "https://code.visualstudio.com"}
  - {word: wink-nlp, means: "a language library the tense reader uses to find the base form of each word", source: "https://github.com/winkjs/wink-nlp"}
  - {word: adjective, means: "a word that describes a noun which the tense reader must not mistake for a past verb"}
  - {word: starfish, means: "the retro form that asks what to start and stop and keep and do more and less"}
  - {word: mechanize, means: "to turn a lesson into a check or a tool so it holds without anyone remembering it"}
