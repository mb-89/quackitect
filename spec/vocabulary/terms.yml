  - {word: heredoc, defines: "[[spec/design_output/bash]]", means: "a block of text written inline in a shell command and fed to that command as input"}
  - {word: hook, defines: "[[spec/design_output/level0#what-level-zero-is]]", means: "a function the harness calls at an event such as a tool call or a turn end"}
  - {word: index, defines: "[[spec/design_output/index]]", means: "the database over this tree that a watcher keeps warm and that answers searches fast"}
  - {word: installer, defines: "[[spec/design_output/index#the-compiler-it-needs]]", means: "the script that sets up the tools a build needs and downloads a missing compiler"}
  - {word: leaf, defines: "[[spec/schemas/ticket.schema]]", means: "a step with no steps under it and the only thing a pull hands out"}
  - {word: level zero, defines: "[[spec/design_output/level0#what-level-zero-is]]", means: "the plugin holding every door that guards the agent from the first turn of a clone"}
