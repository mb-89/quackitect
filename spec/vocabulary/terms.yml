  - {word: pane, defines: "[[spec/design_output/tui]]", means: "the right half of the viewer window that shows the help or the filter"}
  - {word: panel, defines: "[[spec/design_output/extension]]", means: "an editor area that draws one view such as the sidebar page or the problems list"}
  - {word: paragraph, defines: "[[spec/schemas/paragraph.schema]]", means: "a run of sentences in prose that the voice rules cap and shape"}
