# The rules the tooth votes over, one entry each. Level zero pools every file in
# this folder, so a later level drops level1.yml beside this one and changes no
# code. A rule this reader cannot read stands out of the vote.
#
# side     stop ends the turn, continue holds it open and re-prompts.
# priority the higher number wins, and a tie goes to stop.
# decides  claimed means the agent says so, mechanical means a check answers.
# runs     the check, by the name the hook holds it under. A claimed rule naming
#          one fires where the agent claims it and the check stands.
# yields   the claim loses to any mechanical continue that fires, whatever the
#          priorities say. It marks a stop the agent claims over its own work,
#          where the check reads the tree and the claim reads the agent.
# asks     the question the re-prompt puts to the agent.
# says     the sentence a person or an agent reads.

- id: the-owner-asks-to-talk
  side: stop
  priority: 100
  decides: claimed
  asks: Does the last thing the owner said open a discussion?
  says: The owner opens a discussion, so this turn ends and waits.

- id: the-owner-says-carry-on
  side: continue
  priority: 99
  decides: claimed
  says: The owner says carry on, so carry on to the end of the work.

- id: the-chat-is-new
  side: stop
  priority: 95
  decides: claimed
  runs: chat-is-new
  asks: Is this the opening turn of a chat where nobody has said what to do yet?
  says: The chat is new and a person stands at this box, so this turn ends and asks.

- id: a-wrong-answer-leaves-the-box
  side: stop
  priority: 90
  decides: claimed
  yields: true
  asks: Would a wrong answer here reach past this branch, so no later commit undoes it?
  says: A wrong answer here outlives this branch, so this turn ends and asks.

- id: the-owner-holds-this-session
  side: stop
  priority: 85
  decides: mechanical
  runs: owner-holds
  says: The owner holds this session at stop, so this turn ends here.

- id: the-owner-asks-to-finish
  side: stop
  priority: 84
  decides: mechanical
  runs: owner-finishes
  says: The owner holds this session at finish, so this turn ends with the piece in hand.

- id: work-still-stands
  side: continue
  priority: 80
  decides: mechanical
  runs: work-waiting
  says: Something on your list stands unfinished, so carry on with it.

- id: warnings-stand-past-the-number
  side: continue
  priority: 10
  decides: mechanical
  runs: warnings-standing
  says: The warnings stand past the number, and a hand drains them beside you. Carry on with your own work.

- id: the-last-line-names-no-stop
  side: continue
  priority: 50
  decides: mechanical
  runs: no-stop-line
  says: The last line names no stop reason, so this turn holds open.

- id: the-work-stands-complete
  side: stop
  priority: 45
  decides: claimed
  yields: true
  asks: Does the work stand complete?
  says: The work stands complete, so this turn ends.

- id: an-update-is-worth-giving
  side: stop
  priority: 0
  decides: claimed
  yields: true
  asks: Is there an update the owner wants before you go on, and does no work stand?
  says: An update stands worth giving, and nothing else holds, so this turn ends.

- id: the-tooth-is-out
  side: continue
  priority: 0
  decides: mechanical
  runs: stop-hook-off
  says: The stop hook stands off in spec/config/level0.json.
