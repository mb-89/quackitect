# Level one's rule, beside level zero's. The pull writes a hold per hand under
# .se/.runtime/hold, and a turn ending with a hold standing ends on a ticket half done.
# The hook reads the folder, so the rule needs no claim from the agent.
#
# The queue rule reads spec/tickets on a desk bound to the queue and standing
# on trunk. A free open ticket with a leaf a hand takes, or a group at now, is
# work this box owes, so the claim that the work stands complete waits. The cap
# on holds in a row ends a turn over it too, and the next prompt reads the queue again.

- id: the-queue-holds-work
  side: continue
  priority: 80
  decides: mechanical
  runs: queue-waits
  says: The queue holds work for this box, so run ./RUNME.sh ticket pull and carry on.

- id: the-group-stands-in-hand
  side: continue
  priority: 82
  decides: mechanical
  runs: group-in-hand
  says: This box holds a group, so run ./RUNME.sh ticket pull, spawn the hand a spawn answer names, and run ./RUNME.sh branch done once the pull answers wait. A step the harness refuses stays on its ticket, and branch done hands that ticket back.

- id: a-ticket-stands-in-hand
  side: continue
  priority: 81
  decides: mechanical
  runs: ticket-in-hand
  says: A ticket stands in your hand, so work its step and hand it back with ./RUNME.sh ticket pull.
