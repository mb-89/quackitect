# A model holds this rule. No pattern decides it.
# Vale never reads this folder, because .vale.ini names VoiceQuackitect alone.
extends: judge
message: "Write what the reader does next. Put the background in spec/rationales."
link: spec/guidance/guidance.md
level: error
ask: "Does this text tell the reader something they can act on, or does it explain where something came from, what once happened, or how many of something there were?"
labels:
  - actionable
  - background
refuses: background
# A guidance note stands for as long as the tree does, and a reader opens it to
# learn what to do. A handover, a rationale and a design doc each carry
# something else, so this question names the folder it reads.
reads:
  - spec/guidance/*.md
# A runtime older than `reads` falls back to this list, so both stand until
# every session loads the reader that takes `reads`.
ignores:
  - spec/rationales/*.md
  - spec/design_output/*.md
  - spec/funnel/*.md
  - .se/*.md
