extends: script
message: "A judged rule carries ask, message and two labels, and refuses one of them."
link: spec/guidance/guidance.md
level: error
scope: raw
script: |
  text := import("text")

  lines := text.split(scope, "\n")
  matches := []

  asks := false
  says := false
  labels := 0
  refuses := ""
  inList := false
  named := {}

  for i := 0; i < len(lines); i++ {
    line := lines[i]
    trimmed := text.trim_space(line)

    if text.has_prefix(trimmed, "#") { continue }

    if text.re_match(`^ask:\s*\S`, trimmed) { asks = true; inList = false; continue }
    if text.re_match(`^message:\s*\S`, trimmed) { says = true; inList = false; continue }
    if text.re_match(`^refuses:\s*\S`, trimmed) {
      refuses = text.trim_space(text.re_replace(`^refuses:\s*`, trimmed, ""))
      inList = false
      continue
    }
    if text.re_match(`^labels:\s*$`, trimmed) { inList = true; continue }
    if inList {
      if text.re_match(`^-\s+\S`, trimmed) {
        labels = labels + 1
        named[text.trim_space(text.re_replace(`^-\s+`, trimmed, ""))] = true
        continue
      }
      if len(trimmed) > 0 { inList = false }
    }
  }

  ok := asks && says && labels >= 2 && refuses != "" && named[refuses] != undefined
  if !ok {
    matches = append(matches, {begin: 0, end: len(text.trim_space(lines[0]))})
  }
