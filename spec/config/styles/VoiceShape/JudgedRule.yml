extends: script
message: "A judged rule carries ask, message and two labels, and refuses a label it names."
link: spec/guidance/guidance.md
level: error
scope: raw
script: |
  text := import("text")

  lines := text.split(scope, "\n")
  matches := []

  asks := false
  says := false
  labels := 0
  refused := []
  inList := ""
  named := {}

  for i := 0; i < len(lines); i++ {
    line := lines[i]
    trimmed := text.trim_space(line)

    if text.has_prefix(trimmed, "#") { continue }

    if text.re_match(`^ask:\s*\S`, trimmed) { asks = true; inList = ""; continue }
    if text.re_match(`^message:\s*\S`, trimmed) { says = true; inList = ""; continue }
    if text.re_match(`^refuses:\s*\S`, trimmed) {
      refused = append(refused, text.trim_space(text.re_replace(`^refuses:\s*`, trimmed, "")))
      inList = ""
      continue
    }
    if text.re_match(`^refuses:\s*$`, trimmed) { inList = "refuses"; continue }
    if text.re_match(`^labels:\s*$`, trimmed) { inList = "labels"; continue }
    if inList != "" {
      if text.re_match(`^-\s+\S`, trimmed) {
        one := text.trim_space(text.re_replace(`^-\s+`, trimmed, ""))
        if inList == "labels" {
          labels = labels + 1
          named[one] = true
        } else {
          refused = append(refused, one)
        }
        continue
      }
      if len(trimmed) > 0 { inList = "" }
    }
  }

  ok := asks && says && labels >= 2 && len(refused) > 0
  for one in refused {
    if named[one] == undefined { ok = false }
  }
  if !ok {
    matches = append(matches, {begin: 0, end: len(text.trim_space(lines[0]))})
  }
