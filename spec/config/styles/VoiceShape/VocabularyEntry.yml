extends: script
message: "A core entry carries word and from, a term carries word and what it means, and a swap carries word and write."
link: spec/design_output/vocabulary.md
level: error
scope: raw
script: |
  text := import("text")

  // The patterns compile once a run, because the core list holds tens of thousands of entries and one run carries them all.
  wordShape := text.re_compile(`^[a-z][a-z-]*( [a-z][a-z-]*)*$`)
  fromShape := text.re_compile(`^(ste|openste|common|pronoun)$`)
  // The entry splits on the comma and the colon, so a means line holds neither, and no bracket either.
  meansShape := text.re_compile(`, means: "[^",:\[\]{}]+"(,|\}$)`)
  // The source reads off the whole line too, so a comma the split cuts meets the refusal.
  sourceHeld := text.re_compile(`, source: `)
  sourceShape := text.re_compile(`, source: "https?://[^\s",]+"(,|\}$)`)

  lines := text.split(scope, "\n")
  matches := []

  offset := 0
  kind := ""

  for i := 0; i < len(lines); i++ {
    line := lines[i]
    at := offset
    offset += len(line) + 1
    trimmed := text.trim_space(line)

    if trimmed == "words:" { kind = "core"; continue }
    if trimmed == "terms:" { kind = "term"; continue }
    if trimmed == "swaps:" { kind = "swap"; continue }
    if !text.has_prefix(trimmed, "- {") { continue }
    if !text.has_suffix(trimmed, "}") {
      matches = append(matches, {
        begin: at,
        end: at + len(line),
        message: "An entry stands on one line, and this one leaves its brace open."
      })
      continue
    }

    body := trimmed[3:len(trimmed)-1]
    held := {}
    for part in text.split(body, ",") {
      pair := text.split(part, ":")
      if len(pair) < 2 { continue }
      held[text.trim_space(pair[0])] = text.trim_space(text.join(pair[1:], ":"))
    }

    if held.word == undefined || held.word == "" {
      matches = append(matches, {
        begin: at,
        end: at + len(line),
        message: "An entry names its word. Write word: <the word> first."
      })
      continue
    }
    if !wordShape.match(held.word) {
      matches = append(matches, {
        begin: at,
        end: at + len(line),
        message: held.word + " stands outside the shape of a word: lower case letters, a hyphen, and a space between two words."
      })
      continue
    }

    if kind == "core" {
      if held.from == undefined || !fromShape.match(held.from) {
        matches = append(matches, {
          begin: at,
          end: at + len(line),
          message: "A core entry says where it comes from. Write from: ste, openste, common or pronoun."
        })
      }
      continue
    }
    if kind == "term" {
      // The dictionary is the source, so a term points at no note in the tree.
      if held.defines != undefined || text.contains(trimmed, "[[") {
        matches = append(matches, {
          begin: at,
          end: at + len(line),
          message: held.word + " points at a note in the tree. Say what it means under means, and cite an outside source under source."
        })
      }
      if !meansShape.match(trimmed) {
        matches = append(matches, {
          begin: at,
          end: at + len(line),
          message: held.word + " says nothing of what it means. Write means: \"<one line>\" in core words and other terms, with no comma, colon or bracket."
        })
      }
      if sourceHeld.match(trimmed) && !sourceShape.match(trimmed) {
        matches = append(matches, {
          begin: at,
          end: at + len(line),
          message: held.word + " cites a source that is no web address. Write source: \"https://<the address>\"."
        })
      }
      continue
    }
    if kind == "swap" {
      if held.write == undefined || held.write == "" {
        matches = append(matches, {
          begin: at,
          end: at + len(line),
          message: "A swap names the core word to write. Write write: <the word>."
        })
      }
      continue
    }
    matches = append(matches, {
      begin: at,
      end: at + len(line),
      message: "An entry stands under words:, terms: or swaps:, and this one stands under none."
    })
  }
