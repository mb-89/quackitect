extends: script
message: "A guidance note holds fifteen rules. Split this note, or cut a rule."
link: spec/guidance/guidance.md
level: error
scope: raw
script: |
  text := import("text")

  max := 15
  lines := text.split(scope, "\n")
  matches := []

  chapter := false
  rules := 0
  offset := 0
  at := 0

  for i := 0; i < len(lines); i++ {
    line := lines[i]
    here := offset
    offset += len(line) + 1
    trimmed := text.trim_space(line)

    if text.re_match(`^#+\s+Actionables\s*$`, trimmed) {
      chapter = true
      continue
    }
    if !chapter { continue }
    if text.re_match(`^#+\s`, trimmed) { chapter = false; continue }
    if text.re_match(`^[0-9]+\.\s+\S`, trimmed) {
      rules = rules + 1
      if rules == max + 1 { at = here }
      if rules > max {
        matches = append(matches, {begin: here, end: here + len(line)})
      }
    }
  }
