# The action is replace, because each short form here introduces what follows
# and so reads the same wherever it stands. The reading opens on a different
# letter than the abbreviation, so a capture group carries no case and each
# token stands twice, lower and capitalised. `etc.` sits in EtCetera.yml.
extends: substitution
message: "Write it out: '%s' instead of '%s'."
link: spec/guidance/voice.md
level: error
nonword: true
action:
  name: replace
swap:
  '\be\.g\.': "for example"
  '\bE\.g\.': "For example"
  '\bi\.e\.': "that is"
  '\bI\.e\.': "That is"
  '\bviz\.': "namely"
  '\bViz\.': "Namely"
  '\bcf\.': "compare"
  '\bCf\.': "Compare"
