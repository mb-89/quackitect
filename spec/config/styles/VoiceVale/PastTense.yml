extends: sequence
message: "Write the present tense: '%s'. The past belongs in spec/rationales."
link: spec/guidance/guidance.md
level: error
ignorecase: true
# The tagger reads each of these as a past tense verb, and this tree means
# something else by every one. A word here loses its genuine past reading, and
# the past belongs in spec/rationales, where this rule stands off already.
#
# buys, skips and red carry no past reading at all, so the tagger is plainly
# wrong. bound, read and held are the words this tree uses as a noun or a
# status. numbered, settled, complicated, switched and refused read as
# adjectives here, and each one gives up a real past tense to stop a misfire.
exceptions:
  - bound
  - buys
  - complicated
  - held
  - numbered
  - read
  - red
  - refused
  - settled
  - skips
  - switched
tokens:
  - tag: VBD
