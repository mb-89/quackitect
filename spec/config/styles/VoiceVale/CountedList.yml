extends: script
message: "A sentence counts the list or table under it."
link: spec/guidance/voice.md
level: warning
scope: raw
script: |
  text := import("text")

  // A count word in the sentence leading a list or a table, which carries its own count. [[spec/guidance/voice]]
  count := text.re_compile(`(?i)\b(two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\b|(^|[\s(])[0-9]+([\s),:;]|$)`)
  item := text.re_compile(`^(\||[-*+] |[0-9]+[.)] )`)
  stop := text.re_compile(`[.!?]\s+`)

  lines := text.split(scope, "\n")
  matches := []

  offset := 0
  fenced := false
  closed := true
  lead := undefined
  for line in lines {
    at := offset
    offset += len(line) + 1
    trimmed := text.trim_space(line)
    if text.has_prefix(trimmed, "```") || text.has_prefix(trimmed, "~~~") {
      fenced = !fenced
      lead = undefined
      continue
    }
    if fenced { continue }
    if trimmed == "" {
      closed = true
      continue
    }
    if item.match(trimmed) {
      if !is_undefined(lead) {
        said := text.re_replace("`[^`]*`", lead.said, " ")
        parts := stop.split(text.trim_space(said), -1)
        last := parts[len(parts) - 1]
        if count.match(last) {
          matches = append(matches, {
            begin: lead.begin,
            end: lead.end,
            message: "This sentence counts the list or table under it, and the list carries its own count. Say what the reader does with it: I understood the following, then the list."
          })
        }
      }
      lead = undefined
      closed = true
      continue
    }
    if text.has_prefix(trimmed, "#") || text.has_prefix(trimmed, ">") || text.has_prefix(line, "    ") || text.has_prefix(line, "\t") {
      lead = undefined
      closed = true
      continue
    }
    if closed || is_undefined(lead) {
      lead = {said: trimmed, begin: at, end: at + len(line)}
    } else {
      lead = {said: lead.said + " " + trimmed, begin: lead.begin, end: at + len(line)}
    }
    closed = false
  }
