# A line or a heading right above a list or a table that counts it says what
# the structure says already, and the count goes stale the next time a row
# lands. A count is a digit, or a number word from two up, before a plural.
# [[spec/guidance/voice]]
extends: script
message: "'%s' counts the structure under it. Name what the list holds, and let the rows count themselves."
link: spec/guidance/voice.md
level: warning
scope: raw
script: |
  text := import("text")

  fence := "``" + "`"
  count := `(?:^|[^\w-])((?:\d+|[Tt]wo|[Tt]hree|[Ff]our|[Ff]ive|[Ss]ix|[Ss]even|[Ee]ight|[Nn]ine|[Tt]en|[Ee]leven|[Tt]welve) [a-z]+s)\b`

  lines := text.split(scope, "\n")
  starts := []
  offset := 0
  for line in lines {
    starts = append(starts, offset)
    offset += len(line) + 1
  }

  isStructure := func(t) {
    return text.has_prefix(t, "- ") || text.has_prefix(t, "* ") || text.has_prefix(t, "|") || text.re_match(`^\d+[.)]\s`, t)
  }

  matches := []
  fenced := false
  front := 0
  for i := 0; i < len(lines); i++ {
    t := text.trim_space(lines[i])
    if t == "---" && front < 2 { front++; continue }
    if front == 1 { continue }
    if text.has_prefix(t, fence) { fenced = !fenced; continue }
    if fenced || t == "" || isStructure(t) || text.has_prefix(t, "<!--") { continue }
    if text.re_match(`^(?: {4,}|\t)`, lines[i]) { continue }

    next := ""
    for j := i + 1; j < len(lines); j++ {
      n := text.trim_space(lines[j])
      if n == "" { continue }
      next = n
      break
    }
    if !isStructure(next) { continue }

    found := text.re_find(count, lines[i], -1)
    if is_error(found) || found == undefined { continue }
    for hit in found {
      span := hit[1]
      matches = append(matches, {begin: starts[i] + span.begin, end: starts[i] + span.end})
    }
  }
