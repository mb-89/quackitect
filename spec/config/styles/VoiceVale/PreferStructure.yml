extends: script
message: "Paragraphs run together here with no list, table or diagram between them. Carry the rest as structure."
link: spec/guidance/voice.md
level: error
scope: raw
script: |
  text := import("text")

  max := 3
  lines := text.split(scope, "\n")
  matches := []

  fenced := false
  inPara := false
  run := 0
  offset := 0
  runStart := 0
  runEnd := 0

  isStructure := func(line) {
    t := text.trim_space(line)
    if text.has_prefix(t, "#") { return true }
    if text.has_prefix(t, "|") { return true }
    if text.has_prefix(t, ">") { return true }
    if text.has_prefix(t, "- ") { return true }
    if text.has_prefix(t, "* ") { return true }
    if text.has_prefix(t, "+ ") { return true }
    if text.has_prefix(t, "---") { return true }
    if text.has_prefix(t, "<!--") { return true }
    if text.re_match(`^[0-9]+[.)] `, t) { return true }
    if text.re_match(`^ {4,}[^ ]`, line) { return true }
    return false
  }

  for i := 0; i < len(lines); i++ {
    line := lines[i]
    at := offset
    offset += len(line) + 1
    trimmed := text.trim_space(line)

    if text.has_prefix(trimmed, "```") {
      inPara = false
      if run > max { matches = append(matches, {begin: runStart, end: runEnd}) }
      run = 0
      fenced = !fenced
      continue
    }
    if fenced { continue }

    if len(trimmed) == 0 {
      inPara = false
      continue
    }

    if isStructure(line) {
      inPara = false
      if run > max { matches = append(matches, {begin: runStart, end: runEnd}) }
      run = 0
      continue
    }

    if !inPara {
      inPara = true
      if run == 0 { runStart = at }
      run++
    }
    runEnd = at + len(line)
  }
  if run > max { matches = append(matches, {begin: runStart, end: runEnd}) }
