# The action is replace, because a contraction has one written-out form. Each
# token captures its first letter, and the swap writes it back as $1, so a fix
# keeps the case the line already carries.
extends: substitution
message: "Write both words: '%s' instead of '%s'."
link: spec/guidance/voice.md
level: error
ignorecase: true
action:
  name: replace
swap:
  "(c)an't": "$1annot"
  "(w)on't": "$1ill not"
  "(d)on't": "$1o not"
  "(d)oesn't": "$1oes not"
  "(d)idn't": "$1id not"
  "(i)sn't": "$1s not"
  "(a)ren't": "$1re not"
  "(w)asn't": "$1as not"
  "(h)asn't": "$1as not"
  "(h)aven't": "$1ave not"
  "(i)t's": "$1t is"
  "(t)hat's": "$1hat is"
  "(t)here's": "$1here is"
  "(y)ou're": "$1ou are"
  "(t)hey're": "$1hey are"
  "(w)e've": "$1e have"
  "(i)'ve": "$1 have"
  "(w)e'll": "$1e will"
  "(i)t'll": "$1t will"
