extends: script
message: "A normal test takes a fake: import from doors/fake. A test driving the real thing belongs in test/contract."
link: spec/guidance/code/testing.md
level: error
scope: raw
script: |
  text := import("text")

  lines := text.split(scope, "\n")
  matches := []
  offset := 0

  for i := 0; i < len(lines); i++ {
    line := lines[i]
    at := offset
    offset += len(line) + 1
    t := text.trim_space(line)

    if text.has_prefix(t, "//") { continue }
    if text.contains(t, "doors/fake/") { continue }

    if text.re_match(`doors/(disk|proc|git|clock|log)\.js`, t) {
      matches = append(matches, {begin: at, end: at + len(line)})
    }
  }
