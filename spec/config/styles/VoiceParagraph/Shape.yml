scope: raw
script: |
  text := import("text")

  matches := []

  prose := ["does", "says", "checklist", "comment", "help", "ask"]

  frontless := func(said) {
    lines := text.split(said, "\n")
    if len(lines) < 2 || text.trim_space(lines[0]) != "---" { return said }
    out := []
    inside := true
    keep := false
    for at, line in lines {
      if at == 0 {
        out = append(out, line)
        continue
      }
      if inside && text.trim_space(line) == "---" {
        inside = false
        out = append(out, line)
        continue
      }
      if !inside {
        out = append(out, line)
        continue
      }
      found := text.re_find(`^[ \t]*-?[ \t]*([A-Za-z_][A-Za-z0-9_]*):`, line, 1)
      if !is_undefined(found) {
        keep = false
        for one in prose {
          if one == found[0][1].text { keep = true }
        }
      }
      if keep {
        out = append(out, line)
      } else {
        out = append(out, text.repeat(" ", len(line)))
      }
    }
    return text.join(out, "\n")
  }

  rows := func(said) {
    out := []
    at := 0
    for line in text.split(frontless(said), "\n") {
      out = append(out, {said: line, begin: at, end: at + len(line)})
      at += len(line) + 1
    }
    return out
  }

  structure := func(line) {
    t := text.trim_space(line)
    if text.has_prefix(t, "#") { return true }
    if text.has_prefix(t, "|") { return true }
    if text.has_prefix(t, ">") { return true }
    if text.has_prefix(t, "- ") { return true }
    if text.has_prefix(t, "* ") { return true }
    if text.has_prefix(t, "+ ") { return true }
    if text.has_prefix(t, "---") { return true }
    if text.re_match(`^[0-9]+[.)] `, t) { return true }
    if text.re_match(`^ {4,}[^ ]`, line) { return true }
    return false
  }

  said := scope

  fenced := false
  inPara := false
  run := 0
  runStart := 0
  runEnd := 0

  closeRun := func() {
    if run > 3 {
      matches = append(matches, {
        begin: runStart,
        end: runEnd,
        message: "A run holds 3 paragraphs with no list, table or diagram between them, and this one holds " + string(run) + ". Carry the rest as structure."
      })
    }
    run = 0
  }

  for row in rows(said) {
    trimmed := text.trim_space(row.said)

    if text.has_prefix(trimmed, "```") {
      inPara = false
      closeRun()
      fenced = !fenced
      continue
    }
    if fenced { continue }

    if len(trimmed) == 0 {
      inPara = false
      continue
    }

    if structure(row.said) {
      inPara = false
      closeRun()
      continue
    }

    if !inPara {
      inPara = true
      if run == 0 { runStart = row.begin }
      run++
    }
    runEnd = row.end
  }
  closeRun()
