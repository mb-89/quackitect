name: note
description: an observation written down, and later decided

traced: false

sections:
  required:
    - detail
  optional:
    - proposed action
    - done when
    - "evidence: "

fields:
  optional:
    - bucket
    - holder
    - author
    - needs_human
    - depends_on
    - parent
    - ready_when
    - began
    - ended
    - disposition
    - reason
    - successors

states:
  - name: noted
    description: written, waiting to be decided. This is the backlog.
  - name: closed
    description: decided, and the disposition says how

activities:
  - name: write
    supplier: anyone
    input: a raw idea
    does: write it down so a stranger understands it, and cut what nobody needs
    output: a note
    customer: the backlog
    by: anyone
    to: noted
    criteria:
      - says: the guidance this token names was read and applied
      - says: the smallest case that still shows it
        evidence: required
      - says: why it is a problem, and not only what happened
        evidence: required
      - says: a stranger could act on this without asking you anything
      - says: is this a symptom of something bigger, and not only its instance

  - name: decide
    supplier: the backlog
    input: a note
    does: "decide what to do with it. To say it is not ready, name why. depends_on is for other tokens that have to close first, and the engine decides it on its own. ready_when is anything else, in whatever words fit, a date or a condition only a person judges. Deciding not to decide ends nothing: you leave the activity, no transition happens, the note stays noted, and the call log holds that you looked."
    output: a disposition, and a work token when it becomes one
    customer: the backlog
    by: the owner or an assigned agent
    from: noted
    to: closed
    criteria:
      - says: the note was read whole, and not only its title
      - says: the disposition says what happened
        evidence: required
      - says: a became names its successor, and that token exists
      - says: a dropped says why, in a sentence about this note
      - says: not now is ready_when, and not a disposition

dispositions:
  - name: done
    description: the answer was small enough to do, and it was done
  - name: became
    description: the answer is larger work, named in successors
  - name: dropped
    description: it is not a problem, or it is one we will never act on
    reason: required
