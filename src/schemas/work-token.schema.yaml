# The catalogue of everything a work token may carry.
#
# Nothing here says a token carries all of it. A process in src/processes names
# which sections and which fields apply, and everything it does not name is off.
# So this file grows as kinds of work appear, and no token grows with it.
#
# A FIELD IS HERE BECAUSE SOMETHING READS IT, and one nothing reads comes out.
# What that cost and what it settled is [[a-field-is-read-or-gone]].
#
# The frontmatter half is JSON Schema 2020-12, https://json-schema.org/draft/2020-12.
# The body half is this project's own, https://document-schema.org.
#
# A keyword starting x- is ours and is not in either standard, the way
# Kubernetes writes x-kubernetes-validations. Everything else is standard.
#   x-link         the value is written [[in brackets]] and the editor walks it
#   x-enum-from    the values come from somewhere else, named by a path
#   x-max-words    how many words the value may hold
#   x-whole-words  a word joined with _ / or \ to get under the count is refused

kind: work-token

# The guidance for filling one of these. The template writes it onto every
# token, so a reader is one click from the rules.
guidance: work-token

frontmatter:
  type: object
  additionalProperties: false
  required:
    - kind
    - process
    - title
    - status
    - guidance
  properties:
    kind:
      const: work-token
      x-link: true
      description: which schema reads this note

    process:
      x-link: true
      x-enum-from: processes.names
      description: which process shapes this token and says how it moves

    guidance:
      x-link: true
      description: the rules for filling this token

    title:
      x-max-words: 4
      x-whole-words: true
      description: the name this token is known by, in references and in links

    status:
      x-enum-from: process.states
      description: where the token stands. The process owns these values.

    bucket:
      description: the person's own name for a group. It does not move the work

    # THERE IS NO HOLDER HERE. Who has a token is the engine's, kept under .se
    # by holdstore.go and dropped when the agent holding it is gone. It was a
    # field on the token, so a take-up that was never put down left a name in a
    # file nothing reopened, and the queue answered investigate on a hold whose
    # owner had not existed for hours.

    # A CLAIM IS NOT A HOLD, and neither is a field here. A hold belongs to an
    # agent and dies with its session. A claim belongs to a box and travels on
    # the branch, which is why se claim writes claimed_by and claimed_at onto
    # the token rather than under .se.
    #
    # THEY ARE NOT DECLARED, THEY ARE EXEMPT. A declared property is what an
    # author writes, and it reaches completion and the field descriptions as
    # though somebody were meant to fill it in. Nobody fills these in. See
    # theEnginesOwnFields in src/engine/schema.go, and wk-4e643716ec.

    # AND NEITHER IS THE LANE THE WORK STEP WAS DONE IN. worked_in is the box
    # and the session on it, written when a work step is submitted and filled
    # in by nobody, so it is exempt beside the claim. A second name in one
    # session is one evaluator, and the verdict is refused to the lane rather
    # than to the name alone. See laneverdict.go.

    author:
      description: who did the work step, so the verdict is never theirs

    # WHEN IT NEEDS A PERSON, IT SAYS SO. There is no assignee, because which
    # agent does the work was never a thing anybody read. Whether a human is
    # needed is, and it is the one thing that has to reach a screen.
    needs_human:
      description: true when this waits for a person rather than an agent

    # WHAT COMES FIRST, SAID BY THE PERSON WATCHING THE QUEUE. The pull hands
    # an urgent token out before anything else workable, and nothing clears it:
    # a put-down leaves it set, and a person takes it off. It is a flag rather
    # than a rank, so nobody keeps a set of numbers apart.
    urgent:
      description: true when this goes out before everything else workable

    depends_on:
      type: array
      x-link: true
      description: tokens that have to close before this can start

    # A TOKEN WITH SUB-TOKENS IS A SCOPE. The sub-token names its parent, and
    # the parent cannot close while any sub-token is open. Containment and
    # order are two relations: depends_on is order between peers, and this is
    # a piece of work inside a larger one.
    parent:
      x-link: true
      description: the token this is a part of. It cannot close while this is open

    ready_when:
      description: what has to be true before this is worth reading again

    # THE CHANGE, AS TWO HASHES. The engine snapshots the tree when the work
    # is taken up and when it closes, and the diff between them is what
    # changed. A list of files is not written anywhere: it goes stale the
    # day after, and a hash pair does not.
    began:
      type: array
      description: the tree each time the work was taken up, snapshots the engine wrote

    ended:
      type: array
      description: the tree each time the work was put down or closed, snapshots the engine wrote

    disposition:
      x-enum-from: process.dispositions
      description: how it ended. Only an ended token carries one.

    reason:
      description: why it was dropped

    successors:
      type: array
      x-link: true
      description: what it became. They have to exist.

body:
  headingLevel: 2
  order: strict
  extraSections: false

  sections:
    - header: detail
      tense: present
      maxWords: 250
      description: what is asked, or what is wrong, and why it matters

    # THE FUNNEL SECTIONS. An idea is held before anybody commits to it, so it
    # carries what a work token never has to: why it would be worth doing, what
    # it costs to skip, and how much we would be willing to spend. Only the
    # funnel process names these, so no other token grows by a word.
    - header: what we gain
      tense: present
      maxWords: 200
      description: what the system gains by doing it, written so a reader can disagree

    - header: what breaks without it
      tense: present
      maxWords: 150
      description: what stays broken or unbuilt if this is never done

    - header: appetite
      tense: present
      maxWords: 100
      description: how much we would be willing to spend, which bounds the solution rather than predicting it

    - header: not this
      tense: present
      maxWords: 100
      description: what is left out on purpose, so the idea does not grow while it waits

    - header: what we do not know
      tense: present
      maxWords: 250
      description: the open questions and the places a reader could sink, so the idea can be taken up cold

    - header: prior art
      tense: present
      maxWords: 250
      description: what was read and where the thinking came from, with links a later reader can follow

    - header: proposed action
      tense: present
      maxWords: 150
      description: what you think should happen about it

    - header: approach
      tense: present
      maxWords: 200
      description: the interface or the shape the change will take, written before the work so a reader can disagree with it

    - header: done when
      list: true
      description: one criterion per line, each one a thing somebody can check

    - header: note
      tense: past
      maxWords: 150
      description: what changed and why, for a reader who was not here

    # One per activity, named for it. The template writes the table and the
    # process writes the rows.
    - headerPrefix: "evidence: "
      maxWords: 200
      description: what was checked at each step, and what was seen
