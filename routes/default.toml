# The default coding route. Each step: owner, gate, required evidence, routing, budget.
name = "default"
test_cmd = "python3 -m unittest discover -s tests -q"
test_paths = ["tests"]

[[step]]
name = "draft"
owner = "agent"
gate = "mechanical"
requires = ["plan"]
on_pass = "design"
on_fail = "hold"
max_fails = 2
max_attempts = 3
lease_seconds = 1200
progress_seconds = 600
brief = "Write the plan and file it as evidence kind=plan with criteria (acceptance criteria), tests (named tests) and files (files to touch). Change no code in this step."

[[step]]
name = "design"
owner = "agent"
gate = "mechanical"
requires = ["design"]
on_pass = "test"
on_fail = "hold"
max_fails = 2
max_attempts = 3
lease_seconds = 1200
progress_seconds = 600
brief = "Decide the files and interfaces. File evidence kind=design with files and interfaces. Change no code in this step."

[[step]]
name = "test"
owner = "agent"
gate = "red"
requires = ["commit"]
on_pass = "implement"
on_fail = "test"
max_fails = 2
max_attempts = 3
lease_seconds = 1200
progress_seconds = 600
brief = "Write the tests from the plan under the test paths and commit them on the ticket's branch. The tests must FAIL at that commit. File the commit as evidence kind=commit with sha. Write no implementation."

[[step]]
name = "implement"
owner = "agent"
gate = "green"
requires = ["commit"]
on_pass = "review"
on_fail = "implement"
max_fails = 3
max_attempts = 4
lease_seconds = 1800
progress_seconds = 600
brief = "Implement until the test command passes. Commit on the ticket's branch and file the commit as evidence kind=commit with sha. Leave the tests from the test step as they are, or file evidence kind=test_change with why."

[[step]]
name = "review"
owner = "helper"
gate = "review"
requires = ["review"]
on_pass = "accept"
on_fail = "implement"
max_fails = 2
max_attempts = 2
lease_seconds = 900
progress_seconds = 600
brief = "Review the diff against the goal and the plan. File one evidence kind=review with verdict approve or request_changes and findings as a list. Change no code."

[[step]]
name = "accept"
owner = "human"
gate = "human"
requires = []
on_pass = "retro"
on_fail = "implement"
max_fails = 3
max_attempts = 1
lease_seconds = 0
progress_seconds = 0
brief = "The owner decides in the inbox."

[[step]]
name = "retro"
owner = "agent"
gate = "mechanical"
requires = ["retro"]
on_pass = "done"
on_fail = "hold"
max_fails = 1
max_attempts = 2
lease_seconds = 600
progress_seconds = 300
brief = "Read the ticket's timeline and file evidence kind=retro with slow (what slowed the work) and change (what to change in the route or the asks)."
