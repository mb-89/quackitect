# Vale holds every rule a pattern can hold. The style folder is the one place
# they are written, and every caller reads it: the write door in level zero and
# the command line.
StylesPath = spec/config/styles
MinAlertLevel = suggestion

[*.{md,markdown,txt}]
BasedOnStyles = VoiceQuackitect

# The rationales carry the argument, the history and the measurement, so they
# are the one place the past tense belongs. Everything else refuses it.
[spec/rationales/*.md]
VoiceQuackitect.PastTense = NO
