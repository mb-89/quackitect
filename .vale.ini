# Vale holds every mechanical rule. The style folder is the one place they are
# written, and every caller reads it: the write door in level zero, the answer
# at the turn's end, and the command line.
StylesPath = spec/config/styles
MinAlertLevel = suggestion

# Vale reads a file whose extension it knows. A rule file is YAML, and reading
# it as markdown hands a script rule the whole text. A shell script arrives the
# same way, so the path rule draws under the line as a person types.
[formats]
yml = md
yaml = md
.sh = md
.ps1 = md

# VoiceParagraph carries the prose register of the paragraph schema. The
# projection writes it, so a cap moves in spec/schemas/paragraph.schema.yaml and
# the rule file follows. ShapeAnswer holds the answer register and waits for the
# section naming it.
[*.{md,markdown,txt}]
BasedOnStyles = VoiceVale, VoiceParagraph
VoiceParagraph.ShapeAnswer = NO
VoiceParagraph.ParagraphAnswer = NO
VoiceParagraph.ModalRequirement = NO
VoiceVale.CodeComment = NO
VoiceVale.CodeHeader = NO
VoiceVale.DoorsOnly = NO
VoiceVale.OutsideInDoors = NO
VoiceVale.FakeDoorsInTest = NO
VoiceVale.DigitInProse = NO

# Code. Vale lifts comments out with a tree-sitter grammar and leaves string
# literals alone, so the voice rules reach a comment and no other line. A
# comment carries no run of paragraphs, so the shape rules stay away from it.
# A comment names an identifier, a type and a library word, and it writes few of
# them in a code span, so the vocabulary layer stands off code for now. The
# handover carries the count it meets there.
[*.{js,ts,tsx,go}]
BasedOnStyles = VoiceVale, VoiceParagraph
VoiceVale.Private = NO
VoiceVale.CodeComment = YES
VoiceVale.CodeHeader = YES
VoiceVale.CountedList = NO
VoiceVale.DoorsOnly = YES
VoiceVale.FakeDoorsInTest = NO
VoiceVale.DigitInProse = NO
VoiceParagraph.Characters = NO
VoiceParagraph.ListItem = NO
VoiceParagraph.CodeSpans = NO
VoiceParagraph.Markup = NO
VoiceParagraph.Shape = NO
VoiceParagraph.ShapeAnswer = NO
VoiceParagraph.ParagraphAnswer = NO
VoiceParagraph.ModalRequirement = NO
VoiceParagraph.Vocabulary = NO

# The doors reach outside, and their fakes stand in for them. That is the whole
# job of both, so the rule that keeps everybody else inside skips them.
[**/src/doors/*.js]
VoiceVale.DoorsOnly = NO
VoiceVale.OutsideInDoors = NO

[**/src/doors/fake/*.js]
VoiceVale.DoorsOnly = NO
VoiceVale.OutsideInDoors = NO

# The extension loads as CommonJS, so it reaches no door under src/doors. The
# editor files are its door: the editor itself, the server behind the hook
# button, and the files the panel reads.
[**/src/extension/editor*.js]
VoiceVale.DoorsOnly = NO

# The extension is a door layer of its own, and it reads the platform to build
# the path of the server. It imports no door under src/doors, and the `node:`
# guard holds over it, so this section names the outside rule alone.
[**/src/extension/*.js]
VoiceVale.OutsideInDoors = NO

# The hooks module runs inside the harness, whose environment carries no
# `node:` at all. The engine interface is its door layer already.
[**/.claude/skills/level0/hooks/*.js]
VoiceVale.DoorsOnly = NO
VoiceVale.OutsideInDoors = NO

# The stub's bridgehead is a hooks module too, and the client loads it the
# same way. The stub verb copies it out of the template as it stands.
[**/src/stub/.claude/skills/level0/hooks/*.js]
VoiceVale.DoorsOnly = NO
VoiceVale.OutsideInDoors = NO

# A normal test touches memory alone, so it takes a fake.
[**/test/level0/*.js]
VoiceVale.FakeDoorsInTest = YES
VoiceVale.OutsideInDoors = NO

# A contract case drives the real thing, so it reads the environment to set one
# around the door it drives.
[**/test/contract/*.js]
VoiceVale.OutsideInDoors = NO

# A command root builds the hand every verb takes, and it reads the environment
# once to do it. A hook a person's git runs builds its own the same way, and so
# does the root behind each editor.
[**/src/scripts/cli*.js]
VoiceVale.OutsideInDoors = NO

[**/src/scripts/{precommit,prepush,trust,copilot,editor,brand}.js]
VoiceVale.OutsideInDoors = NO

[**/src/bridge/server.js]
VoiceVale.OutsideInDoors = NO

# A Go package names the outside in one file, and every other file of it calls
# that file. So the os import stands in door.go alone, and a Go case drives the
# real thing over a folder it writes, the way a contract case does.
[**/src/**/door.go]
VoiceVale.OutsideInDoors = NO

[**/src/**/*_test.go]
VoiceVale.OutsideInDoors = NO

# The answer level zero reads at the turn's end arrives under this name. It
# takes the tighter limit, because a reader skims an answer.
[*answer.md]
BasedOnStyles = VoiceVale, VoiceParagraph
VoiceParagraph.ShapeAnswer = YES
VoiceParagraph.ParagraphAnswer = YES
VoiceParagraph.ModalRequirement = NO
VoiceParagraph.Shape = NO
VoiceParagraph.Paragraph = NO
VoiceParagraph.PastTense = NO

# A design note says what the tree does, and a number there is a count a
# command answers or a value a file holds. The digit rule reads these notes
# alone, because a rationale argues with its measurements.
[**/spec/design_output/*.md]
VoiceVale.DigitInProse = YES

# The rationales carry the argument, so they are the one place the past tense
# belongs. The perfect, the progressive and the modal carry an argument about
# what happens otherwise, so they stand here beside it. A rationale argues a
# change, so the history marker stands here too.
[**/spec/rationales/*.md]
VoiceVale.History = NO
VoiceVale.CountedList = NO
VoiceParagraph.Hedge = NO
VoiceParagraph.PastTense = NO
VoiceParagraph.Auxiliary = NO
VoiceParagraph.Progressive = NO
VoiceParagraph.Modal = NO

# A design input is the ask, in the words the owner writes it in. It says what a
# hand may do and what it may not, and it enumerates. So the permission modal and
# the long list item stand here, the way the past tense stands in a rationale.
# The design output beside it says what the tree does, under every rule.
[**/spec/design_input/*.md]
VoiceParagraph.Hedge = NO
VoiceParagraph.Modal = NO
VoiceVale.CountedList = NO
VoiceParagraph.ListItem = NO
VoiceParagraph.CodeSpans = NO
VoiceParagraph.Characters = NO

# The requirement register. A design input says `shall` where it binds and
# `should` where it advises, as RFC 2119 gives them. No other register reads
# either word, so the modal rule stands here in its second variant.
[**/spec/design_input/*.md]
VoiceParagraph.Modal = NO
VoiceParagraph.ModalRequirement = YES

# A ticket carries evidence, and a hand writes what it saw and what it ran. So
# the past tense stands here too, and a discussion argues the way a rationale
# does. A group is a ticket, so one glob reaches both. The marker telling what
# stood reads as that same record, and the door refuses a hand the fields of a
# closed ticket, so the rule stands off here.
[**/spec/tickets/*.md]
VoiceVale.History = NO
VoiceParagraph.PastTense = NO
VoiceParagraph.Auxiliary = NO
VoiceParagraph.Progressive = NO
VoiceParagraph.Modal = NO
# A ticket argues, so a line beside a table reads the table back and weighs it.
# A note documents instead, and there the restating is the drift. A ticket's
# count is its record of the moment, so the count rule stands off it too.
VoiceParagraph.RestatedTable = NO
VoiceVale.CountedList = NO

# A private note is a ticket under .se, and the retro decides it. Its own choice
# words read as the past, so it takes the register a ticket takes.
[**/.se/tickets/*.md]
VoiceVale.History = NO
VoiceParagraph.PastTense = NO
VoiceParagraph.Auxiliary = NO
VoiceParagraph.Progressive = NO
VoiceParagraph.Modal = NO
VoiceParagraph.RestatedTable = NO
VoiceVale.CountedList = NO

# The private box holds tickets too, and a note waits there for a retro to
# decide it. That decision is one word out of a fixed list, and two of the three
# read as the past tense. So the register a ticket takes reaches this folder.
[**/.se/tickets/*.md]
VoiceParagraph.PastTense = NO
VoiceParagraph.Auxiliary = NO
VoiceParagraph.Progressive = NO
VoiceParagraph.Modal = NO

# A guidance note carries a shape as well as prose, and VoiceShape holds it.
# The top level reaches the agent at the session's start. A subfolder holds a
# layer the session pulls in where it needs one, under the same shape.
[**/spec/guidance/*.md]
BasedOnStyles = VoiceVale, VoiceParagraph, VoiceShape
VoiceParagraph.ShapeAnswer = NO
VoiceParagraph.ParagraphAnswer = NO
VoiceParagraph.ModalRequirement = NO
VoiceShape.JudgedRule = NO
VoiceShape.StopRule = NO
VoiceShape.VocabularyEntry = NO

[**/spec/guidance/*/*.md]
BasedOnStyles = VoiceVale, VoiceParagraph, VoiceShape
VoiceParagraph.ShapeAnswer = NO
VoiceParagraph.ParagraphAnswer = NO
VoiceParagraph.ModalRequirement = NO
VoiceShape.JudgedRule = NO
VoiceShape.StopRule = NO
VoiceShape.VocabularyEntry = NO


# The word list carries the very words the prose rules read, so only the shape
# rule over an entry reads it.
[**/spec/vocabulary/*.yml]
BasedOnStyles = VoiceShape
VoiceShape.GuidanceEnv = NO
VoiceShape.GuidanceChapter = NO
VoiceShape.GuidanceCap = NO
VoiceShape.JudgedRule = NO
VoiceShape.StopRule = NO

# A shell script carries no prose, so the prose rules stay away from it and
# VoiceScript holds the one rule over it.
[*.{sh,ps1}]
BasedOnStyles = VoiceScript

[**/spec/config/stop/*.yml]
BasedOnStyles = VoiceShape
VoiceShape.GuidanceEnv = NO
VoiceShape.GuidanceChapter = NO
VoiceShape.GuidanceCap = NO
VoiceShape.JudgedRule = NO
VoiceShape.VocabularyEntry = NO

# A name opening with an underscore parks a draft. This section stands last, so
# it takes every style back off again and the language server draws nothing.
# Park a draft as _note.md, and the tree stays green while a kind settles.
[{_*,**/_*}]
BasedOnStyles =
