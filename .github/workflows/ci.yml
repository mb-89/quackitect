name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: quackitect }
      # Live kb import: sibling checkout. Needs BENJAMIN_TOKEN only while
      # the repo is private; it is public at the time of writing.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: mb-89/benjamin
          token: ${{ secrets.BENJAMIN_TOKEN || github.token }}
          path: benjamin
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: install (when sibling present)
        working-directory: quackitect/product/deliverable
        run: |
          if [ -f ../../../benjamin/package.json ]; then npm ci; else echo "sibling missing - skipping install"; fi
      - name: guards + engine tests (dependency-free)
        working-directory: quackitect/product/deliverable
        run: node --test tests/guards.test.ts tests/git.test.ts tests/deliverable.test.ts
      - name: full verify (when sibling present)
        working-directory: quackitect/product/deliverable
        run: |
          if [ -f ../../../benjamin/package.json ]; then npm run verify; else echo "sibling missing - skipped"; fi
