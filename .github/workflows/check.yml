# The rules over this tree, run by a machine with no stake in the answer.
# A session says the check passes; this says whether it does.
name: check
on: push

jobs:
  check:
    # [[spec/tickets/ci-runs-a-windows-job]]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The installer downloads each binary from a pinned release. The key
      # names those versions, so a bump fetches them once and no run after.
      - uses: actions/cache@v4
        with:
          path: .se/bin
          key: se-bin-${{ runner.os }}-vale3.20.0-biome2.5.12

      - run: ./RUNME.sh check
