# The rules over this tree, run by a machine with no stake in the answer.
# A session says the check passes; this says whether it does.
name: check
# A pull request against main runs the check GitHub's auto-merge waits on. [[spec/design_input/the-cloud-runs-itself#the-hand-over]]
# A branch takes its check through its pull request, so a push runs it on main alone, and a rescue or beat push runs nothing. [[spec/design_output/work#one-check-runs-a-head]]
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer head on a pull request cancels the run it supersedes. Each run on main
# stands in a group of its own, so no run there gives way, queued or running.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-pr-{0}', github.event.pull_request.number) || format('check-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # [[spec/tickets/ci-runs-a-windows-job]]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The installer downloads each binary from a pinned release. The key
      # names those versions, so a bump fetches them once and no run after.
      - uses: actions/cache@v4
        with:
          path: .se/bin
          key: se-bin-${{ runner.os }}-biome2.5.12

      # The plugin parts read the hooks with the engine's own tools: claude lays
      # the types and validates the module, and tsc reads the hooks against
      # them. The Linux job carries both, and the Windows job says it lacks them.
      # [[spec/tickets/level0-hooks-move-to-typescript]]
      - if: runner.os == 'Linux'
        run: npm install -g typescript@6.0.2 @anthropic-ai/claude-code@2.1.291

      - run: ./RUNME.sh check
